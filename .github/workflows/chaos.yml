name: Chaos

# Runs the chaos harness (`scripts/chaos.sh`) on a CLEAN runner.
#
# Why a workflow separate from `ci.yml`: the unit tests and clippy prove
# properties of the code; this proves properties of the RUNNING SYSTEM, and only
# whoever breaks it on purpose finds them. Every one of the worst bugs in this
# series came from here and none from reading the code:
#
#   * the holder comes back and every container loses its network FOREVER;
#   * `container rm` left the whole rootfs on disk (the disk-pressure leak);
#   * namespace isolation was turned off — and nothing failed, because a
#     firewall that is never installed returns no error;
#   * a failed recovery tore down the infra it had just brought up.
#
# And — the whole reason for this file — several of them ONLY show up on a clean
# host. The installer died on any machine without a GPU; resource limits are
# inert in a session with no delegated cgroup. Neither is visible on the machine
# of whoever writes the code. A GitHub runner is a clean VM: it is the right
# environment.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, Monday morning. Chaos is not just a PR gate: it catches
    # regressions that come from HOST changes (kernel, systemd, iproute2), not
    # from our code — and nobody triggers those with a commit.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      scale:
        description: 'Number of containers in the `scale` scenario'
        default: '30'
      scenarios:
        description: 'Scenarios to run (empty = all)'
        default: ''
      max_load:
        description: 'Load threshold above which the harness REFUSES to run (empty = nproc/4)'
        default: '2'

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The environment question lives in a JOB of its own, and that placement IS
  # the fix. A step-level `if` can only skip STEPS, and a job whose every
  # meaningful step skipped still reports SUCCESS: measured 2026-09-09 on run
  # 34332409932, where the check was green and neither the harness nor the E2E
  # battery had run. A green check that proved nothing is indistinguishable
  # from one that proved something — the exact class this repository gates
  # against, here applied to the gate itself.
  #
  # As a job-level `if` the harness reports `skipped` instead, which GitHub
  # renders apart from `success` in the checks list and still does not block a
  # merge. That keeps both halves of the original decision: a blocked runner is
  # not the engine's fault and must not go red every week, and a run that
  # measured nothing must not read as green.
  #
  # The probe needs neither the built binary nor any rootless dependency —
  # `unshare -r -n true` is the whole question — so it costs seconds. Keep
  # `runs-on` identical to the harness job below: the moment they differ, the
  # probe stops describing the box that would have run the harness.
  userns:
    name: environment probe (userns)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      userns: ${{ steps.preflight.outputs.userns }}
    steps:
      # The ENVIRONMENT question — CAN this host run the engine? The CODE
      # question — does the engine start? — is the `Preflight` step of the job
      # below, and the two must never be confused. The lesson that forced them
      # apart: the harness silences the output of each command (that is what
      # makes it readable), so an engine that does not even start produced a
      # wall of SKIPs with not ONE line saying why.
      #
      # MEASURED on the hosted runner `ubuntu-24.04`: unprivileged user
      # namespaces are blocked —
      #
      #     unshare: write failed /proc/self/uid_map: Operation not permitted
      #
      # …and without them a rootless engine does not run at all. That is NOT a
      # Delonix failure, and marking the job red over it every week only teaches
      # people to ignore CI. When the environment cannot, the harness stays
      # `skipped` WITHOUT claiming it passed; when the environment can and the
      # engine fails, it is red.
      - name: Preflight — does the environment support rootless?
        id: preflight
        run: |
          if unshare -r -n true 2>/tmp/userns.err; then
            echo "userns=ok" >> "$GITHUB_OUTPUT"
            echo "user namespaces: available"
          else
            echo "userns=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning title=Chaos harness DID NOT RUN::unprivileged user namespaces blocked on this runner — $(cat /tmp/userns.err)"
            {
              echo '## Chaos harness — DID NOT RUN'
              echo
              echo 'The hosted runner does not allow unprivileged user namespaces:'
              echo
              echo '```'
              cat /tmp/userns.err
              echo '```'
              echo
              echo 'A rootless engine does not run without them. **This is not a harness result** —'
              echo 'nothing was proven in this run. The `chaos harness (clean runner)` job stays'
              echo '`skipped` and not `success`, precisely so it does not read as a green.'
              echo
              echo 'To exercise it for real you need a **self-hosted** runner, or a VM'
              echo '(`delonix vm create` + `scripts/chaos.sh`), which is how the findings in this'
              echo 'series were found.'
              [ -e /dev/kvm ] && echo && echo '`/dev/kvm` is present: a nested VM on this runner is viable as a next step.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  chaos:
    name: chaos harness (clean runner)
    needs: userns
    if: needs.userns.outputs.userns == 'ok'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Install pinned toolchain
        run: rustup show

      # The same dependencies `install.sh` requires. We deliberately do NOT run
      # `install.sh` here: this job must exercise the engine, and a broken
      # installer should fail in its own test, not in this one.
      - name: Rootless dependencies
        run: sudo apt-get install -y -qq slirp4netns uidmap nftables iproute2 conntrack

      - name: Build the binary
        run: cargo build --release -p delonix-bin

      # The step this project learned the hard way: without a DELEGATED cgroup
      # the resource limits are silently inert, and the harness would report it
      # as environment instead of testing them. Measured: in a session with no
      # delegation, `-m 128M` leaves `memory.max=max`.
      - name: Set up cgroup delegation
        run: |
          sudo loginctl enable-linger "$USER" || true
          systemctl --user show-environment >/dev/null 2>&1 \
            && echo "user manager: present" \
            || echo "user manager: ABSENT (the limits scenarios will skip)"

      # Ubuntu 23.10+ ships `kernel.apparmor_restrict_unprivileged_userns=1`: a
      # binary WITHOUT a profile cannot create user namespaces, and the engine
      # dies right at `unshare()`. It is the same profile `install.sh` writes.
      # The first version of this workflow omitted it on purpose ("the harness
      # must not depend on the installer") and the result was a whole battery of
      # SKIPs hiding the cause.
      - name: AppArmor profile for userns
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile delonix %s/target/release/delonix flags=(unconfined) {\n  userns,\n}\n' "$PWD" \
              | sudo tee /etc/apparmor.d/delonix >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/delonix
            echo "AppArmor profile installed"
          else
            echo "the host does not restrict userns — profile not needed"
          fi

      - name: Pull the test image
        run: |
          ./target/release/delonix image pull docker.io/library/redis:7-alpine

      # The CODE question, and only it: the environment one was already answered
      # by the `userns` job, without which this one does not even start. A
      # failure here is the ENGINE's, and it is red.
      - name: Preflight — does the engine start?
        run: |
          set -x
          export DELONIX_ROOT=/tmp/dlx-preflight DELONIX_NET_RUNTIME_DIR=/tmp/dlx-pf
          mkdir -p "$DELONIX_ROOT" "$DELONIX_NET_RUNTIME_DIR"
          for d in images layers blobs; do ln -sfn "$HOME/.local/share/delonix/$d" "$DELONIX_ROOT/$d"; done
          ./target/release/delonix net netns up
          ./target/release/delonix container run -d --name preflight --net none \
            docker.io/library/redis:7-alpine sleep 20
          ./target/release/delonix container ps
          ./target/release/delonix container rm -f preflight
          ./target/release/delonix net netns down || true
          rm -rf "$DELONIX_ROOT" "$DELONIX_NET_RUNTIME_DIR"

      # `systemd-run --scope -p Delegate=yes` is what gives the harness a cgroup
      # where the limits actually apply. If the runner has no user manager, the
      # harness SKIPs the affected scenarios and carries on — the exit code
      # reflects FAILURES only, never skips.
      #
      # `--max-load`: the harness refuses to run on a loaded bench (rc=3), and
      # its default is `nproc / 4` — 1.00 on a 4-vCPU hosted runner, which the
      # residual loadavg of the release build above would trip every time. This
      # runner is DEDICATED: the only load on it is ours, and by this step the
      # build is minutes behind. 2.00 is the bench's own "half the threads" rule
      # applied to that box. Raise it here, not in `scripts/bancada.sh`.
      #
      # And this number is STILL unmeasured, on purpose stated: on a hosted
      # runner the preflight above sets `userns=blocked` and this step never
      # runs, so a green run of this workflow says NOTHING about it (measured
      # 2026-09-09, run 34332409932: the only steps that executed were the
      # build, the preflight and the cleanup). It can only be confirmed on a
      # self-hosted runner, or in a VM — which is where the harness is actually
      # exercised.
      - name: Run the chaos harness
        env:
          DELONIX_CHAOS_BIN: ./target/release/delonix
          DELONIX_CHAOS_SCALE: ${{ github.event.inputs.scale || '30' }}
          DELONIX_CHAOS_IMAGE: docker.io/library/redis:7-alpine
          CHAOS_MAX_LOAD: ${{ github.event.inputs.max_load || '2' }}
        run: |
          set -o pipefail
          rc=0
          if systemctl --user show-environment >/dev/null 2>&1; then
            systemd-run --user --scope -p Delegate=yes -q -- \
              bash scripts/chaos.sh --max-load "$CHAOS_MAX_LOAD" ${{ github.event.inputs.scenarios }} 2>&1 | tee chaos.log || rc=$?
          else
            bash scripts/chaos.sh --max-load "$CHAOS_MAX_LOAD" ${{ github.event.inputs.scenarios }} 2>&1 | tee chaos.log || rc=$?
          fi
          # rc=3 is NOT a failing scenario — it is "the bench was unfit, nothing
          # was measured". Saying so beats reading it as a product defect, which
          # is the whole point of the gate; it still fails the step, because a
          # run that measured nothing must not read as green.
          if [ "$rc" -eq 3 ]; then
            echo "::error title=Bench refused::The harness did not run: load above $CHAOS_MAX_LOAD. NOTHING was measured — re-run the workflow."
          fi
          exit "$rc"

      # The E2E battery next to chaos, and not in `ci.yml`, for the same
      # reason: it touches REAL state (containers, networks, volumes) and needs
      # the same rootless environment the steps above already set up. Duplicating
      # it in another workflow meant keeping two copies of the preflight.
      #
      # Why this became a gate: the battery had not run since v0.3.0 —
      # forty-four versions — and when it ran it had nine failures, eight of them
      # because the TEST encoded a bug that had since been fixed. A battery
      # nobody runs proves nothing and lies about what it covers on top of that.
      #
      # Own `DELONIX_ROOT`/`DELONIX_NET_RUNTIME_DIR`: same isolation as the
      # harness, so the E2E never touches what another step left standing.
      - name: CLI E2E battery
        run: |
          set -o pipefail
          E2E=/tmp/dlx-e2e
          rm -rf "$E2E"; mkdir -p "$E2E/root" "$E2E/run"
          for d in images layers blobs; do
            ln -sfn "$HOME/.local/share/delonix/$d" "$E2E/root/$d"
          done
          export DELONIX_ROOT="$E2E/root" DELONIX_NET_RUNTIME_DIR="$E2E/run"
          export DELONIX_NO_CGROUP_WARN=1 OUT=/tmp/delonix-e2e
          export E2E_IMAGE=docker.io/library/redis:7-alpine
          bash scripts/e2e.sh ./target/release/delonix 2>&1 | tee e2e.log
          ./target/release/delonix net netns down >/dev/null 2>&1 || true

      # The summary in the job summary so there is no need to open the logs —
      # and so a SKIP stays visible instead of getting lost in the noise. A skip
      # does not fail the job, but it is information: it means that property was
      # not proven.
      - name: Summary
        if: always()
        run: |
          {
            echo '## Chaos harness'
            echo
            echo '```'
            sed -n '/── resumo ──/,$p' chaos.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || echo '(no summary — see the previous step log)'
            echo '```'
            echo
            echo '## E2E battery'
            echo
            echo '```'
            # SKIP (`~`) and XFAIL/XPASS (`x`/`!`) belong in the summary: a
            # SKIP that only shows up in the full log reads exactly like a
            # green one.
            grep -E '^ (PASS|FAIL|SKIP)=|^ [0-9]+ (SKIP|XFAIL|XPASS|falhas)|^ *[-~x!] ' e2e.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || echo '(sem resumo)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chaos-log
          path: |
            chaos.log
            e2e.log
          retention-days: 30

      # The engine leaves per-node infra (holder netns, slirp) and container
      # directories. On a throwaway runner it would make no difference — but if
      # this job ever runs on a self-hosted runner, leaving that behind is
      # exactly the leak the harness itself exists to catch.
      - name: Cleanup
        if: always()
        run: bash scripts/chaos.sh --clean || true

  # ---- G-003: a skip that nobody declared must not read as green ----
  #
  # The job above is gated on the probe, so on a hosted runner it reports
  # `skipped`. GitHub renders that apart from `success`, but it does not fail the
  # workflow and does not block a merge — so a run that measured NOTHING still
  # reads as a green PR (observed on #872 and #877: 18 gates green, harness
  # `skipping`).
  #
  # Failing whenever the harness does not run is the wrong fix: on hosted runners
  # it never can, so every PR would go red every week, which is what the comment
  # at the top of this file refuses. What must not exist is an UNATTRIBUTED skip.
  # So this gate asks only whether something DECLARES why the harness did not
  # run, and fails when nothing does — a step-level `if` that quietly stops
  # exercising it, or a skip while the environment could have run it.
  #
  # `!cancelled()` is load-bearing: a job whose `needs` was skipped is skipped
  # too by default, which would make this gate disappear exactly when it has
  # something to say.
  skip-gate:
    name: skip gate (a skip must be declared)
    needs: [userns, chaos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: A harness that did not run must have a declared reason
        run: |
          python3 scripts/chaos_skip_gate.py \
            --probe "${{ needs.userns.outputs.userns }}" \
            --harness "${{ needs.chaos.result }}"
