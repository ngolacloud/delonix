# Release — builds and publishes the binaries when a `v*` tag is pushed.
#
# Why in CI and not on the releaser's own machine: the build needs `protoc`
# (delonix-cri) and the artefact must come out of a reproducible environment.
# ubuntu-22.04 runner ON PURPOSE: glibc 2.35 — the binary runs on any distro
# that is the same or newer (RHEL 9, Debian 12, Ubuntu 22.04+); a `latest`
# runner (24.04, glibc 2.39) would exclude the enterprise ones still in use.
#
# Published assets (stable names — scripts/install.sh depends on them):
#   delonix-x86_64-linux, delonix-cri-x86_64-linux, SHA256SUMS,
#   SHA256SUMS.minisig, install.sh, install-vscode.sh
#   plus the aarch64 twins (delonix[-cri|-mcp|-mgmt]-aarch64-linux), built on a
#   native arm64 runner by the `build-arm64` job. There is no -v3 variant on
#   arm64: one binary per component.
#
# SIGNATURE (why): the SHA256SUMS alone proves TRANSFER INTEGRITY, not ORIGIN
# AUTHENTICITY — it comes from the same URL as the binary, so anyone who can
# publish a tampered release (compromised account, stolen CI token) publishes a
# matching SHA256SUMS and the verification passes. The minisign signature closes
# that: the private key is never in the release, and install.sh carries the
# public one embedded. Without the MINISIGN_SECRET_KEY secret configured, the
# release ships WITHOUT a signature and install.sh refuses to install
# (fail-closed) unless given --insecure-skip-signature.
#
# Release notes: docs/releases/<tag>.md if present; otherwise autogenerated.
name: Release

# TRIGGER (2026-09-23): only a manual request. It used to be `push: tags: ["v*"]`,
# which meant the release built the moment a tag reached the remote — including a
# tag pushed by accident (`git push --tags`, `push.followTags=true`), and with no
# step between "the tag exists" and "the world has a binary". Now the tag and the
# release are two decisions: tag when the version is cut, publish when you say so.
#
#     gh workflow run release.yml -f tag=v4.4.0
#
# Consequence, stated because it is the cost of the change: pushing a tag now
# publishes NOTHING. A tag with no release is a normal intermediate state here.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish — must ALREADY exist on the remote (e.g. v4.4.0)"
        required: true

# Every job and step reads the tag from here, never from the ref this workflow was
# dispatched on: the ref is whatever branch the operator happened to have selected,
# and a release that builds one commit and labels it another is the worst kind of
# wrong. `guard` below is what makes this variable trustworthy.
env:
  TAG: ${{ inputs.tag }}

permissions:
  contents: write
  # For `actions/attest-build-provenance`: it signs with an ephemeral OIDC
  # identity of the runner itself (Sigstore/Fulcio), so there is no private key
  # to store anywhere — unlike minisign, whose key is a secret. The two coexist
  # on purpose and answer different questions: minisign proves the release is
  # OURS to whoever has the public key embedded in `install.sh`; provenance
  # proves WHERE and from WHICH COMMIT it was built, to whoever does not trust
  # us up front.
  id-token: write
  attestations: write

jobs:
  # The input is free text, and everything downstream trusts it: it picks the commit
  # to build, names the GitHub release, and is compared against the binary's own
  # version. `tag: main` would have checked out a branch and published a release
  # called "main". So it is validated BEFORE any runner spends ten minutes building:
  # the shape must be `vX.Y.Z[-suffix]`, and the tag must already exist on the remote.
  guard:
    name: guard (the tag is real)
    runs-on: ubuntu-latest
    steps:
      - name: The tag has the shape of a release tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::'$TAG' is not a release tag (expected vX.Y.Z)"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tag exists, and the release does not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null \
            || { echo "::error::tag $TAG does not exist — create and push it first"; exit 1; }
          # Republishing over an existing release is how assets silently change
          # underneath people who already downloaded them. `gh release create` would
          # refuse anyway; failing here says WHY, before the build.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — delete it first if you mean to republish"
            exit 1
          fi
          echo "$TAG -> $(git rev-parse --short "refs/tags/$TAG^{commit}")"
      # G2 of the NO-GO→GO gate: a tag is not published unless it was VALIDATED
      # on its OWN commit. `release_gate.py` refuses unless cargo-test + e2e +
      # chaos + critest are all recorded as passed against this exact commit
      # (`reports/release-validation/<tag>.json`, committed with the release),
      # and CI is green on it. The old failure this closes: v5.1.1 was cut red,
      # with the suites "run on develop weeks ago" — validated, but not THIS
      # build. Fail-closed, before any runner spends ten minutes building.
      - name: The tag was validated on its own commit (release gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          python3 scripts/release_gate.py check --tag "$TAG" --commit "$SHA" \
            --require-ci --repo "$GITHUB_REPOSITORY"

  # Native arm64 build (issue #438). Built on a real aarch64 runner, not cross
  # compiled: a cross build would ship binaries whose `#[cfg(target_arch)]`
  # branches were never executed. ubuntu-22.04 on purpose, like the x86 job:
  # same glibc 2.35 floor. Stripped and version-checked HERE, because the x86
  # runner's `strip` does not recognise aarch64 ELF.
  build-arm64:
    name: build (arm64)
    needs: guard
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      # One action, both jobs — and `ci.yml`'s eight uses. Ten copies of the same
      # shell was ten places for the version to drift apart again, which is the
      # defect that killed the first v5.0.0 publish (see the action for the
      # measurement). The contract check below stays HERE and not in the action:
      # in CI it would be redundant eight times, but a release must never be
      # built by a protoc that cannot compile the contract.
      - uses: ./.github/actions/protoc
      - name: The protoc installed must compile the contract (fail closed)
        run: |
          set -euo pipefail
          protoc -I proto -I third_party/googleapis --descriptor_set_out=/dev/null \
            proto/delonix/node/v1/common.proto proto/delonix/node/v1/node.proto \
            proto/delonix/node/v1/compute.proto proto/delonix/node/v1/infra.proto \
            proto/delonix/node/v1/operations.proto
      - name: Install the pinned toolchain
        run: rustup show
      - name: Runner architecture
        run: test "$(uname -m)" = aarch64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build (release, aarch64)
        run: cargo build --release --locked -p delonix-bin -p delonix-cri-bin -p delonix-mcp-bin -p delonix-mgmt-bin -p delonix-node-api-bin
      - name: Stage, strip and version-check
        run: |
          mkdir -p dist-arm64
          cp target/release/delonix      dist-arm64/delonix-aarch64-linux
          cp target/release/delonix-cri  dist-arm64/delonix-cri-aarch64-linux
          cp target/release/delonix-mcp  dist-arm64/delonix-mcp-aarch64-linux
          cp target/release/delonix-mgmt dist-arm64/delonix-mgmt-aarch64-linux
          cp target/release/delonix-node-api dist-arm64/delonix-node-api-aarch64-linux
          strip dist-arm64/delonix-*-aarch64-linux
          file dist-arm64/delonix-aarch64-linux | grep -q 'ARM aarch64'
          V=$(dist-arm64/delonix-aarch64-linux --version)
          echo "$V"
          echo "$V" | grep -q "${TAG#v}" || { echo "::error::binary version ($V) != tag ($TAG) — was the Cargo.toml bump forgotten?"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-arm64
          path: dist-arm64/
          if-no-files-found: error

  release:
    name: build & publish
    needs: build-arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      # One action, both jobs — and `ci.yml`'s eight uses. Ten copies of the same
      # shell was ten places for the version to drift apart again, which is the
      # defect that killed the first v5.0.0 publish (see the action for the
      # measurement). The contract check below stays HERE and not in the action:
      # in CI it would be redundant eight times, but a release must never be
      # built by a protoc that cannot compile the contract.
      - uses: ./.github/actions/protoc
      - name: The protoc installed must compile the contract (fail closed)
        run: |
          set -euo pipefail
          protoc -I proto -I third_party/googleapis --descriptor_set_out=/dev/null \
            proto/delonix/node/v1/common.proto proto/delonix/node/v1/node.proto \
            proto/delonix/node/v1/compute.proto proto/delonix/node/v1/infra.proto \
            proto/delonix/node/v1/operations.proto
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build (release, generic x86-64)
        run: cargo build --release --locked -p delonix-bin -p delonix-cri-bin -p delonix-mcp-bin -p delonix-mgmt-bin -p delonix-node-api-bin
      - name: Stage the generic binaries
        run: |
          mkdir -p dist-release
          cp target/release/delonix     dist-release/delonix-x86_64-linux
          cp target/release/delonix-cri dist-release/delonix-cri-x86_64-linux
          cp target/release/delonix-mcp dist-release/delonix-mcp-x86_64-linux
          cp target/release/delonix-mgmt dist-release/delonix-mgmt-x86_64-linux
          cp target/release/delonix-node-api dist-release/delonix-node-api-x86_64-linux
      # THE PUBLISHED SITE MUST BE THE ONE GENERATED BY THIS BINARY.
      #
      # This gate exists in `ci.yml` and fired on v0.48.0 — and the release
      # shipped anyway, because one workflow does not look at the other. The
      # result was the live site advertising a version that never had a tag and
      # hiding a new command, for hours, with CI red next to it saying so.
      #
      # Here the check runs BEFORE anything is published, and with the binary
      # that THIS release will deliver — the only one against which the question
      # makes sense.
      - name: The published site must be the generated one (publish gate)
        run: |
          # A venv: this runner's pip (22.04) has no --break-system-packages.
          DOCS_VENV="$RUNNER_TEMP/docs-venv"
          python3 -m venv "$DOCS_VENV"
          "$DOCS_VENV/bin/python" -m pip install --quiet -r scripts/docs-requirements.txt
          PATH="$PWD/target/release:$PATH" "$DOCS_VENV/bin/python" docs/gen.py
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is out of date against this tag's binary."
            echo "Run 'python3 docs/gen.py' with a release build and commit BEFORE cutting the tag."
            git diff --stat -- docs/
            exit 1
          fi
      # x86-64-v3 variant (AVX2/BMI2/FMA — Zen 2+/Haswell+): the installer
      # picks it automatically when the CPU supports it; the generic one
      # remains the universal fallback. A different target-cpu ⇒ full rebuild.
      - name: Build (release, x86-64-v3)
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: cargo build --release --locked -p delonix-bin -p delonix-cri-bin -p delonix-mcp-bin -p delonix-mgmt-bin -p delonix-node-api-bin
      - name: Fetch the arm64 binaries built natively
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-arm64
          path: dist-arm64
      - name: Prepare assets
        run: |
          cp target/release/delonix     dist-release/delonix-x86_64-v3-linux
          cp target/release/delonix-cri dist-release/delonix-cri-x86_64-v3-linux
          cp target/release/delonix-mcp dist-release/delonix-mcp-x86_64-v3-linux
          cp target/release/delonix-mgmt dist-release/delonix-mgmt-x86_64-v3-linux
          cp target/release/delonix-node-api dist-release/delonix-node-api-x86_64-v3-linux
          strip dist-release/delonix-*-x86_64*-linux
          cp scripts/install.sh dist-release/install.sh
          cp scripts/install-vscode.sh dist-release/install-vscode.sh
          cp dist-arm64/* dist-release/
          cd dist-release && sha256sum delonix-aarch64-linux delonix-cri-aarch64-linux delonix-mcp-aarch64-linux delonix-mgmt-aarch64-linux delonix-x86_64-linux delonix-x86_64-v3-linux delonix-cri-x86_64-linux delonix-cri-x86_64-v3-linux delonix-mcp-x86_64-linux delonix-mcp-x86_64-v3-linux delonix-mgmt-x86_64-linux delonix-mgmt-x86_64-v3-linux delonix-node-api-aarch64-linux delonix-node-api-x86_64-linux delonix-node-api-x86_64-v3-linux install.sh install-vscode.sh > SHA256SUMS
      - name: SBOM (SPDX 2.3, from Cargo.lock)
        run: |
          python3 scripts/sbom.py --version "${TAG#v}" > dist-release/delonix-sbom.spdx.json
          # The SBOM goes into the SHA256SUMS that is signed below. Publishing
          # it outside the signature would give an inventory anyone can swap —
          # and a tampered SBOM is worse than none, because it is believed.
          cd dist-release && sha256sum delonix-sbom.spdx.json >> SHA256SUMS
      - name: The editor extension, from its own repository
        # The extension lives in `ngolacloud/delonix-vscode` and releases on
        # its own cadence. It is copied in here — instead of being fetched from
        # there by the installer — so it lands inside the SAME signed
        # SHA256SUMS as everything else: one supply chain, one signature.
        #
        # Best-effort ON PURPOSE. A release of the engine cannot fail because a
        # separate repository has no artefact yet; without the asset the
        # installer takes its `skip editor` path, which says so out loud.
        run: |
          # The failure is REPORTED, not guessed at. A bare `else` here would
          # announce "no extension release yet" for a token that cannot read the
          # other repository, or for a network blip — sending whoever reads the
          # log to look in the wrong place. `2>&1` into a variable keeps the
          # reason and still lets the step succeed.
          if ERR=$(gh release download --repo ngolacloud/delonix-vscode \
                     --pattern '*.vsix' --dir /tmp/vsix 2>&1); then
            cp /tmp/vsix/*.vsix dist-release/delonix-vscode
            cd dist-release && sha256sum delonix-vscode >> SHA256SUMS
          else
            echo "::notice::this engine release ships without the editor extension: $ERR"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sanity — the binary starts and reports the tag's version
        run: |
          V=$(dist-release/delonix-x86_64-linux --version)
          echo "$V"
          echo "$V" | grep -q "${TAG#v}" || { echo "::error::binary version ($V) != tag ($TAG) — was the Cargo.toml bump forgotten?"; exit 1; }
      - name: Sign the SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          PUB=$(grep -oP '^MINISIGN_PUBKEY="\K[^"]+' scripts/install.sh)
          # The hard guard only applies once the signature IS expected, i.e.
          # once install.sh has a real public key embedded. At that point,
          # shipping unsigned would break ALL installers (client-side
          # fail-closed) — that is an error, not a warning. Before then, signing
          # is not yet expected and the release ships unsigned, with a loud
          # warning.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            if [ "$PUB" != "__POR_PREENCHER__" ]; then
              echo "::error::MINISIGN_PUBKEY is configured but the MINISIGN_SECRET_KEY secret is missing — this release would ship unsigned and ALL installers would refuse it. See docs/SECURITY-RELEASES.md"
              exit 1
            fi
            echo "::warning::release WITHOUT a signature — the key has not been configured yet (see docs/SECURITY-RELEASES.md). install.sh warns and verifies transfer integrity only."
            exit 0
          fi
          # minisign is NOT in this runner's apt index (Azure mirror, without the
          # `universe` component served) — `apt-get install minisign` failed
          # DETERMINISTICALLY across 3 runs of v0.38.0, even with universe
          # "added" and a clean `update`. Instead of apt, download the OFFICIAL
          # static binary, with its version + SHA256 PINNED and verified (the
          # same trust-by-digest pattern as the rest of the project — never an
          # unverified download). Fail-closed: a wrong checksum aborts here.
          MINISIGN_VER=0.12
          MINISIGN_SHA=9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
          curl -fsSL -o /tmp/minisign.tgz \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VER}/minisign-${MINISIGN_VER}-linux.tar.gz"
          echo "${MINISIGN_SHA}  /tmp/minisign.tgz" | sha256sum -c -
          tar xzf /tmp/minisign.tgz -C /tmp
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v
          # The private key only exists on the runner's disk during this step.
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          cd dist-release
          # The password goes via STDIN — minisign reads it from there when there
          # is no tty. Without this the step would hang waiting for input (a key
          # generated with -W, without a password, ignores the pipe fine).
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -S -s /tmp/minisign.key -m SHA256SUMS \
                -c "delonix-runtime $TAG" -t "delonix-runtime $TAG"
          shred -u /tmp/minisign.key 2>/dev/null || rm -f /tmp/minisign.key
          # Confirm the signature verifies with the public key that install.sh
          # carries embedded — catches a key swap BEFORE publishing, not after,
          # when all installers already fail.
          echo "untrusted comment: delonix-runtime" > /tmp/pub.pub
          echo "$PUB" >> /tmp/pub.pub
          minisign -V -p /tmp/pub.pub -m SHA256SUMS \
            || { echo "::error::the signature does NOT verify with the public key embedded in install.sh — key swapped?"; exit 1; }
      # SLSA provenance for the published binaries. The action is GitHub's own,
      # not a third party — the alternative (installing cosign on the runner)
      # would add supply-chain surface to the step that exists to guarantee it,
      # which is also why the SBOM comes from a script of ours and not a `syft`.
      #
      # Verify with: gh attestation verify <file> --repo ngolacloud/delonix
      - name: Provenance (SLSA) of the binaries
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            dist-release/delonix-x86_64-linux
            dist-release/delonix-x86_64-v3-linux
            dist-release/delonix-cri-x86_64-linux
            dist-release/delonix-cri-x86_64-v3-linux
            dist-release/delonix-mcp-x86_64-linux
            dist-release/delonix-mcp-x86_64-v3-linux
            dist-release/delonix-mgmt-x86_64-linux
            dist-release/delonix-mgmt-x86_64-v3-linux
            dist-release/delonix-node-api-x86_64-linux
            dist-release/delonix-node-api-x86_64-v3-linux
            dist-release/delonix-aarch64-linux
            dist-release/delonix-cri-aarch64-linux
            dist-release/delonix-mcp-aarch64-linux
            dist-release/delonix-mgmt-aarch64-linux
            dist-release/delonix-node-api-aarch64-linux
            dist-release/delonix-sbom.spdx.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if [ -f "$NOTES" ]; then
            # Title = first line (heading) of the notes — convention of the earlier releases.
            TITLE=$(head -1 "$NOTES" | sed 's/^#* *//')
            gh release create "$TAG" dist-release/* --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist-release/* --title "$TAG" --generate-notes
          fi
      # Post-publish: prove the PUBLISHED release holds up end to end — the
      # signature verifies against the pubkey embedded in install.sh, every file
      # matches its digest in the signed SHA256SUMS, the SBOM rides INSIDE that
      # manifest, and SLSA provenance verifies against the runner's OIDC
      # identity. Closes G1e of the go/no-go
      # (reports/go-nogo-alta-criticidade-20261101/): until now those three facts
      # were "PASS by design", never checked against the real artifacts —
      # install.sh verifies ONE asset a user downloads, release_verify.py is a
      # different thing (evidence-rot of the maturity table). Run with --tag, so
      # it re-downloads what was actually PUBLISHED, not the local dist-release.
      # Fail-closed. minisign and gh are already installed/authenticated by this
      # job. Only runs when the release IS signed; before the key exists the
      # release ships unsigned (the step above ends with a warning) and there is
      # no signature to verify.
      - name: Verify the published artifacts (closes G1e)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUB=$(grep -oP '^MINISIGN_PUBKEY="\K[^"]+' scripts/install.sh)
          if [ "$PUB" = "__POR_PREENCHER__" ]; then
            echo "::notice::release is unsigned (key not configured yet) — skipping published-artifact verification; see docs/SECURITY-RELEASES.md"
            exit 0
          fi
          python3 scripts/verify_release_assets.py --tag "$TAG" --repo "$GITHUB_REPOSITORY"
      # DYNAMIC documentation per release: the docs/RELEASES.md appendix
      # (features per release) and the handbook's generated facts are regenerated
      # from the notes and pushed to a `release-docs/<tag>` BRANCH, for a
      # maintainer to merge into main through a PR.
      #
      # Not a direct push to main any more: main is protected (ruleset
      # `ngolacloud-protected`: PR + required checks), and GitHub refuses the
      # GitHub Actions app as a bypass actor of a repository ruleset. A PR also
      # puts CI on this commit, which the old `[skip ci]` push never did:
      # 5d0d5947 (v0.2.0's appendix) turned `lang ratchet` red on main and no run
      # saw it. The step does not open the PR itself: this repository does not let
      # GITHUB_TOKEN create PRs, and a PR opened with that token would not trigger
      # CI anyway, so the required checks would never report. The link goes to the
      # job summary instead; a PR a person opens runs CI as usual.
      #
      # A Python of its own ONLY from here on: this job runs on ubuntu-22.04 for the
      # binaries' glibc 2.35, and that runner's python3 is 3.10 — no `tomllib`
      # (dev_docs.py) and a pip without `--break-system-packages` (dev_docs_site.py).
      # On v4.5.0 both generators died that way and the step said all was up to date.
      # The binaries are already built and published by now, so changing the python3
      # on PATH does not touch what ships. 3.12 is ubuntu-latest's, where ci.yml runs
      # the same generators with --check.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Update the releases appendix (branch for a PR into main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Walter Angolar"
          git config user.email "angolar.devops@gmail.com"
          DOCS_BRANCH="release-docs/${TAG}"
          git fetch origin main
          git checkout -B "$DOCS_BRANCH" origin/main
          bash scripts/gen-releases.sh
          # The generated facts of the contributor handbook follow the release too;
          # the narrative is reviewed by a person after the release is validated.
          # A generator failure must not cost the release appendix, which was independent
          # of it before: commit what did regenerate, then FAIL the step. A warning was
          # not enough — v4.5.0 shipped with both generators dead and a green run.
          FAILED=""
          python3 scripts/dev_docs.py \
            || { echo "::error::dev_docs.py failed — the docs/dev facts go unregenerated in this release"; FAILED="$FAILED dev_docs.py"; }
          # A venv, not `pip --break-system-packages`: it works whatever pip the runner has.
          VENV="$RUNNER_TEMP/dev-docs-venv"
          { python3 -m venv "$VENV" && "$VENV/bin/python" -m pip install --quiet -r scripts/docs-requirements.txt \
              && "$VENV/bin/python" scripts/dev_docs_site.py; } \
            || { echo "::error::dev_docs_site.py failed — the handbook site goes unregenerated in this release"; FAILED="$FAILED dev_docs_site.py"; }
          # `git status`, not `git diff`: a page added to the handbook is an UNTRACKED
          # file, which `git diff --quiet` does not see.
          if [ -n "$(git status --porcelain -- docs/RELEASES.md docs/dev docs/handbook)" ]; then
            git add docs/RELEASES.md docs/dev docs/handbook
            git commit -m "docs(releases): appendix and handbook facts updated for ${TAG}"
            git push origin "HEAD:refs/heads/${DOCS_BRANCH}"
            PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${DOCS_BRANCH}?expand=1"
            echo "::notice::Release docs for ${TAG} pushed to ${DOCS_BRANCH} — open the PR into main: ${PR_URL}"
            {
              echo "### Release docs for ${TAG}"
              echo
              echo "Regenerated on \`${DOCS_BRANCH}\`. main is protected, so they reach it through a PR:"
              echo "**[open the PR into main](${PR_URL})** — CI runs on it like on any other."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$FAILED" ]; then
            echo "docs/RELEASES.md and docs/dev already up to date — nothing to commit"
          else
            echo "Nothing to commit, but NOT because the docs are up to date: failed${FAILED}"
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Handbook generators failed:${FAILED} — regenerate by hand and open a PR"
            exit 1
          fi
