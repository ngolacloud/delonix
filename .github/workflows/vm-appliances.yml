# Builds an appliance image (OPNsense, Proxmox, TrueNAS) and publishes it to
# ghcr — the ones `delonix vm create --disk <name>` uses with no install at all.
#
# One product per run, on purpose: each build boots a VM with 4-6 GiB and
# writes several GiB to disk, and the runner has no headroom to do them in
# parallel.
#
# MANUAL dispatch — publishing an official image is an explicit decision.
#
# THE ISOs: all THREE scripts fetch and verify the media themselves (v0.48.0).
# `version` is enough; `iso_url`/`iso_sha256` are for media the vendor does not
# publish in the usual place — an internal build, a private mirror.
#
# The previous note said the Proxmox ISOs "are NOT downloadable from the
# machine where this was written" and therefore required both inputs. The host
# it names (`download.proxmox.com`) does return 000 from here — but **that is
# not where the ISOs come from**: the official downloads page
# (proxmox.com/en/downloads/…/iso) points EXCLUSIVELY to
# `enterprise.proxmox.com` (verified 2026-08-13: 9 occurrences, zero of the
# other), which is where the ISOs and the `SHA256SUMS` live, and where the four
# new images were built. `download.proxmox.com` serves the apt repositories,
# not this media. It is the host `build-proxmox.sh` uses by default
# (`PROXMOX_MIRROR` to change it).
#
# The checksum is never optional: with `iso_url`, `iso_sha256` becomes
# required, and without it the script resolves it from the vendor's
# `SHA256SUMS`. An unverified download never reaches the build through either
# path.
name: VM appliance images

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Appliance to build"
        type: choice
        options:
          - opnsense
          - pve
          - pbs
          - pmg
          - pdm
          - truenas
        required: true
      version:
        description: "FULL version, to DOWNLOAD (e.g.: 26.1.2, 9.2-1, 25.10.5) — must exist at the vendor. Empty = the version pinned in the script"
        default: ""
      tag:
        description: "Publish tag (empty = the version SERIES, `26.1.2` → `26.1`). This project's convention is the series, like `delonix-vm-k8s:1.34`"
        default: ""
      iso_url:
        description: "ISO URL — only for media the vendor does not publish in the usual place. Empty = the script downloads and verifies by itself"
        default: ""
      iso_sha256:
        description: "ISO SHA-256 — REQUIRED if iso_url is given"
        default: ""
      dest_repo:
        description: "Destination OCI repository"
        default: "ghcr.io/ngolacloud/delonix-vm-appliances"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler qemu-system-x86 qemu-utils xorriso python3-venv curl
          # Without /dev/kvm the scripts fall back to TCG by themselves; worth logging which it was.
          if [ -w /dev/kvm ]; then echo "KVM: available"; else echo "KVM: ABSENT (TCG build, slow)"; fi

      - name: Disk space
        run: |
          # A build writes the ISO (~2 GiB), the extracted tree (~2 GiB) and the
          # VM disk (grows to ~4 GiB). The runner's `/` has no headroom for
          # that; `/mnt` does.
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo mkdir -p /mnt/appliances && sudo chown "$USER" /mnt/appliances
          df -h / /mnt

      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build delonix
        run: cargo build --release --locked -p delonix-bin

      - name: Validate the inputs
        id: vars
        run: |
          set -euo pipefail
          p='${{ inputs.product }}'
          # A URL with no checksum is the only combination refused: the normal
          # path resolves the hash from the vendor's `SHA256SUMS`, and whoever
          # brings media from elsewhere must also bring what proves it.
          if [ -n '${{ inputs.iso_url }}' ] && [ -z '${{ inputs.iso_sha256 }}' ]; then
            echo "::error::iso_sha256 is required when iso_url is given"; exit 1
          fi
          case "$p" in
            opnsense) echo "name=opnsense" ;;
            pve)      echo "name=proxmox-ve" ;;
            pbs)      echo "name=proxmox-backup-server" ;;
            pmg)      echo "name=proxmox-mail-gateway" ;;
            pdm)      echo "name=proxmox-datacenter-manager" ;;
            truenas)  echo "name=truenas-scale" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Download and verify the ISO (only with iso_url)
        if: ${{ inputs.iso_url != '' }}
        working-directory: /mnt/appliances
        run: |
          set -euo pipefail
          curl -fL --no-progress-meter -o src.iso '${{ inputs.iso_url }}'
          # Fails CLOSED: an unverified ISO never reaches the build.
          echo '${{ inputs.iso_sha256 }}  src.iso' | sha256sum -c -

      - name: Build the image
        working-directory: /mnt/appliances
        env:
          OUT_DIR: /mnt/appliances
          MEDIA_CACHE: /mnt/appliances/.media
        run: |
          set -euo pipefail
          S="$GITHUB_WORKSPACE/scripts/appliances"
          # With `iso_url` you pass the PATH; without it you pass the VERSION
          # (empty = the one pinned in the script) and the script downloads and
          # verifies. Both paths live in the same argument: a file that exists
          # is used as-is, everything else is treated as a version.
          # `if` and not `[ … ] && SRC=…`: under `set -e` the short form is only
          # safe because the test comes BEFORE the `&&` — reordering it one day
          # would make the step exit 1 with no error line. Measured, and not
          # worth the risk.
          SRC='${{ inputs.version }}'
          if [ -n '${{ inputs.iso_url }}' ]; then SRC=/mnt/appliances/src.iso; fi
          case '${{ inputs.product }}' in
            opnsense) "$S/build-opnsense.sh" ${SRC:+"$SRC"} ;;
            truenas)  "$S/build-truenas.sh"  ${SRC:+"$SRC"} ;;
            *)        "$S/build-proxmox.sh" '${{ inputs.product }}' ${SRC:+"$SRC"} ;;
          esac
          rm -f src.iso
          ls -lh /mnt/appliances/*.qcow2

      - name: Prove it boots and serves
        # OPNsense is left out: its web UI only listens on the LAN, and a probe
        # over the WAN would be refused — the CORRECT behaviour of a firewall.
        if: ${{ inputs.product != 'opnsense' }}
        working-directory: /mnt/appliances
        env:
          OUT_DIR: /mnt/appliances
        # Name the product: with no argument the script verifies every image
        # present, and a CI run builds ONE.
        run: |
          "$GITHUB_WORKSPACE/scripts/appliances/verify-boot.sh" '${{ inputs.product }}'

      - name: Register and publish
        id: publish
        env:
          DELONIX_ROOT: /mnt/appliances/root
          # A PAT with `write:packages` (secret GHCR_TOKEN) takes precedence;
          # without it, the GITHUB_TOKEN — which does NOT CREATE a new package in
          # a user's namespace (403), it only publishes to packages that already
          # exist.
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D=./target/release/delonix
          N='${{ steps.vars.outputs.name }}'
          case '${{ inputs.product }}' in
            opnsense) STEM=opnsense; VCPUS=2; MEM=3G ;;
            pve)      STEM=pve;      VCPUS=4; MEM=4G ;;
            pbs)      STEM=pbs;      VCPUS=2; MEM=2G ;;
            pmg)      STEM=pmg;      VCPUS=2; MEM=2G ;;
            pdm)      STEM=pdm;      VCPUS=2; MEM=2G ;;
            truenas)  STEM=truenas;  VCPUS=4; MEM=8G ;;
          esac
          # The image is DISCOVERED, not built by name. The builds now stamp
          # the version onto the file (`pve-9.2-1.qcow2`) so two releases can
          # coexist, and the fixed names that used to be here
          # (`/mnt/appliances/pve.qcow2`) would leave this step pointing at a
          # file that no longer exists — after the whole build has run. The
          # `-bootcheck` is `verify-boot.sh`'s scratch overlay.
          #
          # A glob loop and NOT `ls -1 a.qcow2 b-*.qcow2 | …`: with two patterns
          # where only one matches, `ls` returns 2 — the `2>/dev/null` hides the
          # MESSAGE but not the code —, `pipefail` propagates it and `set -e`
          # aborts the step printing nothing. That is how this run died with
          # `exit code 2` and zero output, after having built and verified the
          # whole image. It is the same pattern `verify-boot.sh` already uses,
          # and there it was right.
          IMG=""
          for cand in /mnt/appliances/"$STEM".qcow2 /mnt/appliances/"$STEM"-*.qcow2; do
            case "$cand" in *-bootcheck.qcow2) continue ;; esac
            if [ -f "$cand" ]; then IMG=$cand; break; fi
          done
          test -n "$IMG" || { echo "::error::no image /mnt/appliances/$STEM*.qcow2"; ls -l /mnt/appliances; exit 1; }
          echo "image: $IMG"
          # The EXACT version comes out of the file name when the input was
          # empty — the script decides the pinned version, and the metadata must
          # say what is actually there and not "unknown".
          VER='${{ inputs.version }}'
          [ -n "$VER" ] || VER=$(basename "$IMG" .qcow2 | sed -n "s/^$STEM-//p")
          # The version you DOWNLOAD and the tag you PUBLISH are different
          # things, and they were coupled. The vendor publishes the file by the
          # exact version (`OPNsense-26.1.2-nano-amd64.img`), but this project's
          # tag convention is the SERIES — it is what the golden does
          # (`delonix-vm-k8s:1.34`, not `:1.34.9`). With a single input it was
          # impossible to ask for one: `version=26.1` made the download fail,
          # because that file does not exist on the mirror.
          #
          # `--release` stores the EXACT version on purpose: the tag says the
          # series, the metadata says what is actually there.
          TAG='${{ inputs.tag }}'
          # The Proxmox build suffix drops BEFORE the series cut: the version is
          # `9.2-1` and the published tag is `9.2` (that is how the four from
          # 2026-08-13 went in, alongside `proxmox-ve-9.1`). Without stripping
          # the `-1`, the dot-based `cut` returned `9.2-1`, because there is only
          # one dot.
          [ -n "$TAG" ] || TAG="$(echo "${VER%%-*}" | cut -d. -f1-2)"
          # An empty tag would publish `proxmox-ve:` and an empty `--release` —
          # the registry would accept it and nobody would know what is there. It
          # happens when the `version` input is empty AND the file carries no
          # version in its name (a build from a local ISO with another name).
          # Fail here, saying what to do, instead of publishing an image with no
          # identity.
          if [ -z "$TAG" ] || [ -z "$VER" ]; then
            echo "::error::could not get the version from '$IMG' — pass the \`version\` input (and \`tag\` if the series does not follow from it)"
            exit 1
          fi
          echo "downloaded version: $VER · published tag: $TAG"
          # `--appliance`: none of these runs cloud-init, and without this mark
          # the `vm create` on the other side would again attach a NoCloud seed
          # to them.
          $D vm image import "$IMG" -t "$N:$TAG" --appliance \
            --distro "$N" --release "$VER" \
            --default-vcpus "$VCPUS" --default-memory "$MEM"
          $D vm image ls
          echo "${GHCR_TOKEN:-$GITHUB_TOKEN}" | $D image login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          $D vm image push "$N:$TAG" "${{ inputs.dest_repo }}:$N-$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Appliance published"
            echo
            echo '```bash'
            echo "delonix vm pull ${{ inputs.dest_repo }}:${{ steps.vars.outputs.name }}-${{ steps.publish.outputs.tag }}"
            echo "delonix vm create my-${{ inputs.product }} --disk ${{ steps.vars.outputs.name }}-${{ steps.publish.outputs.tag }}"
            echo '```'
            echo
            echo "Does not run cloud-init: configure it on first boot (console or web interface)."
          } >> "$GITHUB_STEP_SUMMARY"
