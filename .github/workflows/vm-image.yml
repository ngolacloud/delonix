# Builds the official golden VM image and publishes it to ghcr — the one
# `delonix vm pull` (no argument) downloads. Reproducible and independent of
# any development machine: it runs on the runner, with the binary built from
# the commit itself.
#
# MANUAL trigger (`workflow_dispatch`) — publishing the official image is an
# explicit decision, not a side effect of every push. The Actions
# `GITHUB_TOKEN` already carries `packages: write`, so no secrets are needed.
#
# Note: `virt-customize` runs with delonix's `--offline` mode (it fetches the
# k8s .deb packages on the host, verified, and installs them without network in
# the appliance) — this is the path that needs no DHCP/DNS in the guest.
# GitHub's Linux runners have /dev/kvm (nested virt); without it, libguestfs
# falls back to TCG (slower, but it works).
name: VM image (golden)

on:
  workflow_dispatch:
    inputs:
      k8s_version:
        description: "Kubernetes version (image tag) — ignored if no_k8s=true"
        default: "1.36"
      ubuntu_release:
        description: "Base Ubuntu cloud image (used when distro=ubuntu)"
        default: "24.04"
      image:
        description: "Destination OCI repository"
        default: "ghcr.io/ngolacloud/delonix-vm-k8s"
      no_k8s:
        description: "Build the variant WITHOUT Kubernetes (delonix + rootless only)"
        type: boolean
        default: false
      distro:
        description: "Base distro for --no-k8s builds"
        type: choice
        options:
          - ubuntu
          - debian
          - rocky
          - fedora
        default: ubuntu
      debian_release:
        description: "Debian codename (used when distro=debian, --no-k8s builds)"
        default: "trixie"
      rocky_release:
        description: "Rocky major version (used when distro=rocky, --no-k8s builds)"
        default: "9"
      fedora_release:
        description: "Fedora release AND build (e.g. 42-1.1) — the build is not deduced from the version"
        default: "44-1.1"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Golden build tools
        run: |
          sudo apt-get update
          # isc-dhcp-client (dhclient): the supermin appliance virt-customize boots
          # to run --network tries `dhclient` then falls back to `dhcpcd` for the
          # appliance's own eth0 — and on a stock ubuntu-24.04 runner NEITHER is
          # installed (supermin only COPIES binaries the HOST already has).
          # Measured: /init prints "dhcpcd: command not found", eth0 never gets an
          # address, /etc/resolv.conf never exists, and the guest's apt-get fails
          # DNS resolution within ~10s — not the ~300s dhclient-lease timeout this
          # engine's own hint text describes (that number is about a REAL guest's
          # dhclient, not the throwaway supermin appliance virt-customize boots to
          # do the customizing). Same already-documented class of bug as the
          # k8s/online recipe's host prerequisites — see the engine's own
          # AGENTS.md, the section about known host prerequisites for the
          # virt-customize build.
          sudo apt-get install -y protobuf-compiler libguestfs-tools qemu-utils cloud-image-utils \
            qemu-system-x86 ovmf isc-dhcp-client
          # KVM for the boot probe below; without it the probe falls back to TCG (slower, same verdict).
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          # supermin/libguestfs needs to read the host kernel (runners: 0600).
          sudo chmod 0644 /boot/vmlinuz-* || true
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build delonix + delonix-cri
        run: cargo build --release --locked -p delonix-bin -p delonix-cri-bin
      - name: Compute destination tag/repository
        id: vars
        run: |
          if [ "${{ inputs.no_k8s }}" = "true" ]; then
            if [ "${{ inputs.distro }}" = "debian" ]; then
              echo "tag=delonix-vm-base:debian-${{ inputs.debian_release }}" >> "$GITHUB_OUTPUT"
              echo "dest_tag=debian-${{ inputs.debian_release }}" >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.distro }}" = "rocky" ]; then
              echo "tag=delonix-vm-base:rocky-${{ inputs.rocky_release }}" >> "$GITHUB_OUTPUT"
              echo "dest_tag=rocky-${{ inputs.rocky_release }}" >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.distro }}" = "fedora" ]; then
              # The tag carries only the MAJOR. `--fedora-release` has to carry
              # the build (`42-1.1`) because the vendor's artefact name carries
              # it and the version does not determine it — but `fedora-42-1.1`
              # as an OCI tag tells its reader nothing more than `fedora-42`, and
              # would fall out of line with its siblings (`ubuntu-24.04`,
              # `rocky-9`).
              FED_MAJOR="${{ inputs.fedora_release }}"; FED_MAJOR="${FED_MAJOR%%-*}"
              echo "tag=delonix-vm-base:fedora-${FED_MAJOR}" >> "$GITHUB_OUTPUT"
              echo "dest_tag=fedora-${FED_MAJOR}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=delonix-vm-base:ubuntu-${{ inputs.ubuntu_release }}" >> "$GITHUB_OUTPUT"
              echo "dest_tag=ubuntu-${{ inputs.ubuntu_release }}" >> "$GITHUB_OUTPUT"
            fi
            echo "dest_repo=ghcr.io/ngolacloud/delonix-vm-base" >> "$GITHUB_OUTPUT"
          else
            echo "tag=delonix-vm-k8s:${{ inputs.k8s_version }}" >> "$GITHUB_OUTPUT"
            echo "dest_tag=${{ inputs.k8s_version }}" >> "$GITHUB_OUTPUT"
            echo "dest_repo=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the golden VM image (offline)
        if: ${{ !inputs.no_k8s }}
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          ./target/release/delonix vm image build \
            --tag "${{ steps.vars.outputs.tag }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            --k8s-version "${{ inputs.k8s_version }}" \
            --cri-bin ./target/release/delonix-cri \
            --delonix-bin ./target/release/delonix \
            --offline
          ./target/release/delonix vm image ls
      # Unlike the golden one (`--offline`, no network in the appliance), a
      # `--no-k8s` build INSTALLS packages in there and really does need network.
      # What provides it is passt, and Ubuntu 24.04's — the runner's — is the one
      # that fails in both already-measured modes: it either refuses libguestfs's
      # `$XDG_RUNTIME_DIR` via AppArmor, or it starts, never hands out a lease,
      # leaves `dhclient` hanging for 300s and the build carries on WITHOUT
      # network until the package manager fails to resolve a mirror. Hence the
      # two halves: a runtime dir the profile allows, and a current passt FIRST
      # on PATH (libguestfs looks for it with `passt --help`, so building it
      # without putting it on PATH changes nothing).
      - name: current passt (the --no-k8s build needs network in the appliance)
        if: ${{ inputs.no_k8s }}
        run: |
          git clone --depth 1 https://passt.top/passt /tmp/passt-src
          make -C /tmp/passt-src -j"$(nproc)"
          mkdir -p /tmp/delonix-run && chmod 700 /tmp/delonix-run
          echo "/tmp/passt-src" >> "$GITHUB_PATH"
      - name: Build the golden VM image (without Kubernetes)
        if: ${{ inputs.no_k8s }}
        env:
          LIBGUESTFS_BACKEND: direct
          XDG_RUNTIME_DIR: /tmp/delonix-run
        run: |
          if [ "${{ inputs.distro }}" = "debian" ]; then
            ./target/release/delonix vm image build \
              --tag "${{ steps.vars.outputs.tag }}" \
              --distro debian \
              --debian-release "${{ inputs.debian_release }}" \
              --delonix-bin ./target/release/delonix \
              --no-k8s
          elif [ "${{ inputs.distro }}" = "rocky" ]; then
            ./target/release/delonix vm image build \
              --tag "${{ steps.vars.outputs.tag }}" \
              --distro rocky \
              --rocky-release "${{ inputs.rocky_release }}" \
              --delonix-bin ./target/release/delonix \
              --no-k8s
          elif [ "${{ inputs.distro }}" = "fedora" ]; then
            ./target/release/delonix vm image build \
              --tag "${{ steps.vars.outputs.tag }}" \
              --distro fedora \
              --fedora-release "${{ inputs.fedora_release }}" \
              --delonix-bin ./target/release/delonix \
              --no-k8s
          else
            ./target/release/delonix vm image build \
              --tag "${{ steps.vars.outputs.tag }}" \
              --ubuntu-release "${{ inputs.ubuntu_release }}" \
              --delonix-bin ./target/release/delonix \
              --no-k8s
          fi
          ./target/release/delonix vm image ls
      # A build that exits 0 is not a disk that boots: the 1.36 tag published on
      # 2026-08-24 stopped at `grub rescue>` under SeaBIOS and nothing here noticed.
      # Boot the artefact under both firmwares, on the bus a Proxmox template uses,
      # and refuse to push unless the kernel is reached. See scripts/vm_boot_probe.sh.
      - name: Boot probe (SeaBIOS and OVMF) before publishing
        run: |
          img="${DELONIX_ROOT:-${XDG_DATA_HOME:-$HOME/.local/share}/delonix}/vm-images/$(echo '${{ steps.vars.outputs.tag }}' | tr ':' '_').qcow2"
          scripts/vm_boot_probe.sh "$img" both
      - name: Login to ghcr and push
        env:
          # A PAT with `write:packages` (GHCR_TOKEN secret) takes precedence;
          # without it, the GITHUB_TOKEN — which only publishes when the repo's
          # "Workflow permissions" are set to "Read and write" (Settings →
          # Actions → General).
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "${GHCR_TOKEN:-$GITHUB_TOKEN}" | ./target/release/delonix image login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          ./target/release/delonix vm image push \
            "${{ steps.vars.outputs.tag }}" \
            "${{ steps.vars.outputs.dest_repo }}:${{ steps.vars.outputs.dest_tag }}"
      - name: Summary
        run: |
          echo "### Golden VM image published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.vars.outputs.dest_repo }}:${{ steps.vars.outputs.dest_tag }}\` — test with \`delonix vm pull\`." >> "$GITHUB_STEP_SUMMARY"
