[package]
name = "delonix-node-api-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

# `delonix-node-api` — the node API's own executable (ADR-0040 D2.4 as amended,
# P5). People reach it as `delonix serve node-api`, which runs this binary.
[[bin]]
name = "delonix-node-api"
path = "src/main.rs"

[dependencies]
delonix-model = { workspace = true }
delonix-node = { workspace = true }
delonix-host = { workspace = true }
delonix-node-api = { workspace = true }
# The bin is the one layer that names the assembly: it mounts the `Engine` and
# hands the node API a `VmReads` over it (ADR-0040 A5, R3d). `delonix-compute`
# names the VM record the port speaks in.
delonix-engine = { workspace = true }
delonix-compute = { workspace = true }
delonix-telemetry = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true
