[package]
name = "delonix-node-api-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

# `delonix-node-api` — the node API's own executable (ADR-0040 D2.4 as amended,
# P5). People reach it as `delonix serve node-api`, which runs this binary.
[[bin]]
name = "delonix-node-api"
path = "src/main.rs"

[dependencies]
delonix-model = { workspace = true }
delonix-node = { workspace = true }
delonix-host = { workspace = true }
delonix-node-api = { workspace = true }
# The bin is the one layer that names the assembly: it mounts the `Engine` and
# hands the node API a `VmReads` over it (ADR-0040 A5, R3d). `delonix-compute`
# names the VM record the port speaks in.
delonix-engine = { workspace = true }
delonix-compute = { workspace = true }
# R3d-d: the bin backs the node API's `StorePort` with the `delonix-state` adapter
# directly (a bin may name an adapter, ADR-0040 A1), so the interface no longer
# opens the record store itself.
delonix-state = { workspace = true }
# R3d-e — bin composes the container-create host adapters behind RunResolver.
delonix-oci = { workspace = true }
delonix-volume = { workspace = true }
delonix-linux = { workspace = true }
# R3d-e — bin installs the SDN VM-network + linux process-leaves providers into
# the shared vm_registry.
delonix-sdn = { workspace = true }
# R3d-h — bin composes the per-adapter capability reports behind the node API's
# `ProviderReports` port (`HostProviders`), so the interface no longer names the
# Proxmox/OPNsense providers in `providers.rs`.
delonix-provider-proxmox = { workspace = true }
delonix-provider-opnsense = { workspace = true }
delonix-telemetry = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true
