[package]
name = "delonix-mgmt-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

# `delonix-mgmt` — the local management API's own executable (ADR-0040 D2.4 as
# amended). People reach it as `delonix serve api`, which runs this binary.
[[bin]]
name = "delonix-mgmt"
path = "src/main.rs"

[dependencies]
delonix-node = { workspace = true }
delonix-host = { workspace = true }
delonix-mgmt = { workspace = true }
# The bin is the one place that names the assembly: it mounts the `Engine` and
# hands the management API a `VmView` over it (ADR-0040 A5, R3c). `delonix-compute`/
# `delonix-model` name the VM record and the shared error the port speaks in.
delonix-engine = { workspace = true }
delonix-compute = { workspace = true }
delonix-model = { workspace = true }
delonix-telemetry = { workspace = true }
# R3f: the `EngineOps` port serves adapter-typed reads (images, …) as JSON
# values; the bin serializes them when implementing the port over the engine.
serde_json = { workspace = true }

[lints]
workspace = true
