# ============================================================================
# kind: HTTPRoute — declarative L7/HTTP reverse proxy (Gateway API style)
#
# Routes by Host and/or path prefix to backend containers. The proxy (embedded
# hyper) runs INSIDE the holder netns — it reaches backends by their SDN IP —
# and publishes the entry ports on the host. TLS terminates at the proxy
# (self-signed by default, or a PEM pair from a `kind: Secret`). ALL HTTPRoute
# (and Ingress) documents of a manifest compose into ONE proxy: listeners are
# merged by port (TLS wins on collision), routes are concatenated, and there is
# a SINGLE certificate (no SNI). `kind: Ingress` is the k8s spelling of the SAME
# proxy (Compat→HTTPRoute, see ingress.yaml); the L4 firewall is `kind:
# NetworkPolicy` (see ../networking/networkpolicy.yaml).
#
# Backends MUST be `kind: Container` with an IP on a custom SDN network (not
# --net host/none): each container keeps its own name and IP, so a route names
# it directly.
#
# Apply:    delonix stack apply -f examples/gateway/httproute.yaml
# ============================================================================

# ── 1. Backends — SDN network + containers the routes name ───────────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: appnet
spec:
  driver: bridge              # custom network: gives backends an internal IP
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: web
spec:
  image: "nginx:1.27-alpine"
  network: appnet             # on a custom network, so the proxy reaches it by IP
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: api
spec:
  image: "hashicorp/http-echo:latest"
  command: ["-listen=:3000", "-text=hello from api"]   # serves on :3000
  network: appnet
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: admin
spec:
  image: "hashicorp/http-echo:latest"
  command: ["-listen=:9000", "-text=admin"]            # serves on :9000
  network: appnet

# ── 2. selfSigned (default) — main route, two listeners ──────────────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: HTTPRoute
metadata:
  name: loja
spec:
  entrypoints:
    - { port: 80 }            # plain HTTP listener (tls defaults to false)
    - { port: 443, tls: true } # TLS terminates here (requires spec.tls)
  tls:
    mode: selfSigned          # selfSigned (default, cert generated for the hosts) | secretRef
  rules:
    - host: loja.exemplo.ao   # matched against the Host header (omit = any Host)
      paths:
        - path: /             # path prefix; the longest prefix wins
          backend: { service: web, port: 80 }
        - path: /api          # more specific prefixes win
          backend: { service: api, port: 3000 }

# ── 3. secretRef — BYO certificate from a kind: Secret ───────────────────────
---
# PEM pair under tls.crt / tls.key (tls_crt / tls_key also work). Replace the
# placeholders with a real pair before serving real traffic.
apiVersion: core.delonix.io/v1beta1
kind: Secret
metadata:
  name: painel-cert
spec:
  stringData:
    tls.crt: "-----BEGIN CERTIFICATE-----\nplaceholder\n-----END CERTIFICATE-----"
    tls.key: "-----BEGIN PRIVATE KEY-----\nplaceholder\n-----END PRIVATE KEY-----"
---
apiVersion: networking.delonix.io/v1beta1
kind: HTTPRoute
metadata:
  name: painel
spec:
  entrypoints:
    - { port: 8080 }          # extra HTTP listener, merged with the ones above
    - { port: 8443, tls: true }
  tls:
    mode: secretRef           # use the Secret's certificate instead of a self-signed one
    secretRef: painel-cert    # kind: Secret holding tls.crt / tls.key
  rules:
    - host: admin.exemplo.ao
      paths:
        - path: /
          backend: { service: admin, port: 9000 }

# ── 4. catch-all — a rule with no host (any Host), no entrypoints ────────────
---
# No `host` matches ANY Host (a catch-all by path); `path` omitted defaults to
# `/`. No `entrypoints`: defaults to port 80 (plus 443 with TLS if `tls` were set).
apiVersion: networking.delonix.io/v1beta1
kind: HTTPRoute
metadata:
  name: catch-all
spec:
  rules:
    - paths:
        - backend: { service: web, port: 80 }
