# ============================================================================
# kind: Ingress — Kubernetes-shaped L7/HTTP Ingress (networking.k8s.io/v1)
#
# It is the k8s shape (host/path → backend service) of the SAME embedded L7
# proxy as `kind: HTTPRoute` — Compat→HTTPRoute: it compiles to that proxy and
# is composed with every Ingress/HTTPRoute of the manifest into a SINGLE proxy
# with ONE certificate (no SNI). The old `kind: Ingress`-as-L4-firewall is gone
# — the L4 firewall is now `kind: NetworkPolicy` (see
# ../networking/networkpolicy.yaml).
#
# Backends MUST be `kind: Container` with an IP on a custom SDN network (not
# --net host/none). No effect (accepted for k8s fidelity): `ingressClassName`
# (the embedded proxy is the only class), `tls[].hosts` (reported as not
# applied), `pathType: Exact` (served as a prefix, warned), a `tls` list longer
# than one (only the first is used) and named ports (`port.name` is refused:
# use `port.number`).
#
# Apply:    delonix stack apply -f examples/gateway/ingress.yaml
# ============================================================================

# ── 1. Backends — SDN network + containers the Ingress names ─────────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: sdn-demo
spec:
  driver: bridge              # the L7 proxy only reaches backends on the SDN
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: web
spec:
  image: "nginx:alpine"       # nginx serves on :80
  network: sdn-demo
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: api
spec:
  image: "caddy:alpine"       # caddy:alpine serves on :80
  network: sdn-demo
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: docs
spec:
  image: "httpd:2.4-alpine"   # httpd serves on :80
  network: sdn-demo

# ── 2. secretRef — BYO certificate from a kind: Secret ───────────────────────
---
# PEM pair under tls_crt / tls_key (tls.crt / tls.key also work). Replace the
# placeholders with a real pair before serving real traffic.
apiVersion: core.delonix.io/v1beta1
kind: Secret
metadata:
  name: shop-tls
spec:
  stringData:
    tls_crt: "-----BEGIN CERTIFICATE-----\nplaceholder\n-----END CERTIFICATE-----"
    tls_key: "-----BEGIN PRIVATE KEY-----\nplaceholder\n-----END PRIVATE KEY-----"

# ── 3. Full Ingress — listeners, TLS, two hosts, paths, defaultBackend ───────
---
apiVersion: networking.delonix.io/v1beta1
kind: Ingress
metadata:
  name: shop
spec:
  ingressClassName: delonix          # accepted for k8s fidelity (the embedded proxy is the only class)
  entrypoints:                       # delonix extension: listener ports. Omit = 80 (+443 when tls is set)
    - { port: 80 }
    - { port: 443, tls: true }       # terminate TLS on this port
  tls:                               # a LIST in k8s; this engine serves a single certificate (no SNI)
    - hosts: [shop.example.ao]       # accepted but NOT applied (no SNI)
      secretName: shop-tls           # kind: Secret with tls_crt/tls_key; omit = self-signed
  rules:
    - host: shop.example.ao          # Host header to match; omit = any host
      http:
        paths:
          - path: /
            pathType: Prefix         # matched by prefix (Exact is served as a prefix)
            backend:
              service:
                name: web            # container name, resolved to its SDN IP at apply
                port:
                  number: 80         # container port (named ports are not supported)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80         # caddy:alpine serves on :80
    - host: docs.example.ao          # a second host in the same Ingress
      http:
        paths:
          - path: /                  # `path` defaults to /
            backend:
              service:
                name: docs
                port:
                  number: 80
  defaultBackend:                    # catch-all when no rule matches
    service:
      name: web
      port:
        number: 80

# ── 4. Minimal Ingress — joins the same proxy, no TLS, no entrypoints ────────
---
# No `entrypoints`: defaults to port 80. No `tls`: serves HTTP only.
apiVersion: networking.delonix.io/v1beta1
kind: Ingress
metadata:
  name: status
spec:
  rules:
    - host: status.example.ao
      http:
        paths:
          - path: /healthz
            backend:
              service:
                name: api
                port:
                  number: 80
