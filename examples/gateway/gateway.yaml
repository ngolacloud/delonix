# ============================================================================
# kind: Gateway — exposes ONE local TCP port to the public internet (via a tunnel)
#
# Through a third-party provider (pinggy/ngrok/cloudflare). Deliberately
# single-purpose: it only does the outbound transport. To publish MANY backends
# behind one public URL, point `localPort` at the `kind: HTTPRoute` proxy's port
# (see httproute.yaml) — that is what does the L7 Host/path routing; the L4
# firewall is `kind: NetworkPolicy`. Each provider is a real, already-installed
# CLI: pinggy (zero extra binary, just `ssh`), ngrok (needs the `ngrok` agent on
# PATH), cloudflare (needs `cloudflared` on PATH).
#
# `token` and `tokenSecretRef` are two ways to give the SAME credential: use ONE
# per document. Only ONE ngrok tunnel can be alive at a time (its local agent API
# has a fixed port).
#
# Apply:    delonix stack apply -f examples/gateway/gateway.yaml
# One-shot equivalent, no manifest (pinggy is the default provider):
#   delonix net tunnel expose 80
# ============================================================================

# ── 1. Minimal — pinggy free tier, no account and no extra binary ────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: Gateway
metadata:
  name: public-min
spec:
  provider: pinggy            # scalar form = select with no options
  localPort: 80               # local port to expose (e.g. the HTTPRoute proxy, or a published port)

# ── 2. pinggy with a pro token given literally (works, but prefer tokenSecretRef)
---
apiVersion: networking.delonix.io/v1beta1
kind: Gateway
metadata:
  name: public-pinggy-pro
spec:
  provider:
    type: pinggy              # pinggy | ngrok | cloudflare
    spec:                     # what only that service understands
      token: "REPLACE-WITH-PINGGY-PRO-TOKEN"   # literal token — prefer tokenSecretRef in a manifest
  localPort: 8080

# ── 3. Token Secret — stringData under spec, key `token` ─────────────────────
---
# The provider reads the credential from this Secret's `token` key (placeholder value).
apiVersion: core.delonix.io/v1beta1
kind: Secret
metadata:
  name: tunnel-token
spec:
  stringData:
    token: "REPLACE-WITH-PROVIDER-TOKEN"

# ── 4. ngrok with a reserved hostname and the token read from a Secret ───────
---
apiVersion: networking.delonix.io/v1beta1
kind: Gateway
metadata:
  name: public-ngrok
spec:
  provider:
    type: ngrok
    spec:
      hostname: demo.ngrok.app       # custom/reserved hostname — ngrok uses it as --url
      tokenSecretRef: tunnel-token   # kind: Secret whose `token` key holds the authtoken
  localPort: 8080

# ── 5. cloudflare NAMED tunnel — cloudflared tunnel run --token ... ──────────
---
# Runs a tunnel you already created. `hostname` is informational only — the route
# lives in the Cloudflare dashboard. `insecureSkipTlsVerify` skips verification of
# the LOCAL backend's self-signed cert (origin https://localhost:<localPort>); the
# public URL always has a real certificate.
apiVersion: networking.delonix.io/v1beta1
kind: Gateway
metadata:
  name: public-cloudflare
spec:
  provider:
    type: cloudflare
    spec:
      hostname: app.example.com
      tokenSecretRef: tunnel-token
  localPort: 8443
  insecureSkipTlsVerify: true        # only affects the LOCAL backend; no-op for pinggy

# ── 6. cloudflare quick tunnel — no token at all (an ephemeral trycloudflare.com URL)
---
apiVersion: networking.delonix.io/v1beta1
kind: Gateway
metadata:
  name: public-cloudflare-quick
spec:
  provider: cloudflare
  localPort: 80
