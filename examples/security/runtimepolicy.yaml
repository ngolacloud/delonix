# ============================================================================
# kind: RuntimePolicy — this node's admission ceiling (M04, ADR-0026)
#
# The ceiling THIS host puts on what may run. It gives a manifest form to the
#     file `<root>/policy.json`, the SAME one `container run`/`vm create` already
#     check before anything is created. Every field starts at "no opinion", so a
#     policy states only what it wants to restrict.
#
# A node-wide SINGLETON. Whatever `metadata.name` says, apply always writes
#     the ONE `policy.json` — a manifest declares at most ONE RuntimePolicy
#     document (a second is refused by `stack validate`/`apply`).
#
# It converges like any Kind (a changed field really is applied), but does
#     NOT come down on its own: removing this document and running `stack apply
#     --prune` (or `stack destroy`) leaves the ceiling as it was. The only way
#     down is `delonix policy unset` (asks for confirmation, or `--force`).
#
# Apply:    delonix stack apply -f examples/security/runtimepolicy.yaml
# ============================================================================

# ── 1. the node ceiling — all 13 fields, made explicit ─────────────────────
---
apiVersion: policy.delonix.io/v1beta1
kind: RuntimePolicy
metadata:
  name: node-ceiling
spec:
  mode: enforce                         # `enforce` (refuse, default) or `warn` (allow and report)
  denyPrivileged: true                  # refuse `container run --privileged`
  denyHostNetwork: true                 # refuse `--net host` (this engine's DEFAULT network mode)
  denyLatestTag: true                   # refuse a container image with no tag or `:latest`
  allowedRegistries: [ghcr.io, docker.io]   # only these registries may be pulled; empty = no opinion
  workloadSecurity: baseline            # the only v1 profile — refuses what `--privileged` is made of (caps beyond the PSS baseline, the host PID/IPC namespaces, seccomp/apparmor unconfined, host-path binds, host devices, a custom masked/ro list that drops the defaults); omitted = no opinion
  denyDevicePassthrough: true           # refuse `vm create --device` (VFIO PCI passthrough) — hands the guest DMA to host hardware
  denyLatestVmImage: true               # refuse a VM disk image with no tag or `:latest` (separate from denyLatestTag: a `--vmfile` build tags `<name>:latest`)
  allowedImageUrlHosts: [cloud.debian.org]  # hosts a `vm create --url-img` qcow2 may be fetched from; empty = no opinion
  allowedSourcePrefixes: [10.10.0.0/16]     # GRANT — canonical a.b.c.d/len prefixes `--allow-source` may use; empty = none
  allowSourceCheckOptOut: false         # GRANT — true lets a container use `--no-source-check`; absent = refused
  denyPrivateEgress: true               # refuse new egress from a workload to private space (10/8, 172.16/12, 192.168/16, 100.64/10) through the node's uplink
  allowedEgressPrefixes: [10.0.0.0/8]   # GRANT — private destinations still reachable while denyPrivateEgress is on; empty = none
  # In effect: `delonix get runtimepolicies` and `delonix describe runtimepolicy node-ceiling` show what is enforced.
