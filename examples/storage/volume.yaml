# ============================================================================
# kind: Volume — a named volume (data survives `container rm`)
#
# ONE Kind, SEVERAL MUTUALLY EXCLUSIVE shapes (hence one document each): a
# local volume, a raw network driver, a network-share block
# (`nfs:`/`cifs:`/`webdav:` — the block's NAME is the type), a slice of
# ANOTHER volume (`share:`), provisioning on a NAS (`provision:`) and a
# volume allocated in a storage pool (`pool:`). `quota` and `alertPct` apply
# to every shape. `kind: Storage` and `kind: ShareVolume` were FOLDED in here
# (the load refuses them and names this form); `storageRef` survives as an
# alias of `share.from`, and `options` as an alias of `mountOptions`.
#
# A workload consumes any volume the SAME way: `-v <name>:/path` (container),
# `volumes:` (pod/stack), or `spec.volumes` on a VM (libvirt 9p).
#
# Apply:    delonix stack apply -f examples/storage/volume.yaml
# ============================================================================

# ── Supporting Secret — credentials for the network shares below ─────────────
# Credentials live in a `kind: Secret` (encrypted vault), NEVER in cleartext
# in the manifest — that is the reason `passwordSecret` exists. Cleartext
# only here because this is an example (the apply warns you about it).
---
apiVersion: core.delonix.io/v1beta1
kind: Secret
metadata:
  name: nas-creds
spec:
  stringData:
    password: troca-me          # SMB/WebDAV password
    apiKey: dummy-truenas-key    # TrueNAS API key

# ── 1. local — a plain local volume (the common case) ────────────────────────
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: local-data
  labels:                       # stored on the volume; also carry the stack ownership stamp
    app: demo
spec:
  driver: local                 # local (default) — omit for local
  quota: 2G                     # size cap (monitored in rootless, hard as root)
  alertPct: 80                  # usage % above which `ls`/`describe` show WARN (default 90)

# ── 2. raw driver — mount an NFS export without the friendly block ───────────
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: raw-nfs
spec:
  driver: nfs                        # non-local driver
  device: "10.0.0.5:/mnt/pool/raw"   # "server:/export"; only with driver: nfs
  mountOptions: "vers=4.1,soft"      # `mount -o` options (alias: options)

# ── 3. nfs: — an NFS share (TrueNAS, Synology, nfs-kernel-server) ────────────
# This is the volume a VM consumes via `spec.volumes` (libvirt 9p) — see
# examples/compute/virtualmachine.yaml.
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: nfs-media
spec:
  nfs:
    server: 10.0.0.5                 # NAS host or IP (required)
    share: /mnt/pool/media           # NFS export path (required)
    readOnly: false                  # true = mounted read-only
    mountOptions: "vers=4.1,soft"    # extra `mount -o` options
  quota: 500G
  alertPct: 85

# ── 4. cifs: — an SMB/CIFS share (Samba, Windows, TrueNAS SMB) ───────────────
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: cifs-backups
spec:
  cifs:
    server: nas.local                # required
    share: backups                   # SMB share name, no leading slash (required)
    username: delonix                # SMB user
    passwordSecret: nas-creds        # reads key `password` from this Secret (preferred)
    # password: troca-me             # inline alternative (discouraged)
    readOnly: false
    mountOptions: "vers=3.0"

# ── 5. webdav: — a WebDAV share (Nextcloud, ownCloud) ────────────────────────
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: webdav-cloud
spec:
  webdav:
    server: cloud.example.com        # host, or full URL (http://host:port) to override the scheme
    share: /remote.php/dav/files/delonix   # path inside the WebDAV endpoint
    username: delonix
    passwordSecret: nas-creds
    readOnly: false

# ── 6. share: — an isolated, individually-quota'd slice of ANOTHER volume ─────
# A real subdirectory of the parent's mount (`nfs-media` above), registered
# as its own volume: several workloads share ONE NAS export without seeing
# each other's data or exhausting each other's quota. `metadata.namespace` is
# OPTIONAL — absent = the unscoped root (not the `default` tenant). Exclusive
# with nfs/cifs/webdav, device, a non-local driver and provision.
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: team-share
  namespace: teamA                   # scopes the name and data dir; omit = unscoped root
spec:
  share:
    from: nfs-media                  # required — the parent volume to carve out of (alias: storageRef)
  quota: 5G                          # SOFT quota for this slice (measured usage + alert); omit = unlimited
  alertPct: 90

# ── 7. provision.truenas: — create the dataset/quota/export on a NAS, then mount
# OPTIONAL (ADR-0009); without this block the Kind behaves exactly as before.
# Makes on the NAS: the dataset, its quota, the owner/mode of the mountpoint
# and an NFS export restricted to the listed networks. The mount's
# `server`/`share` are DERIVED from what the appliance reported, never written
# twice. Destroy the remote side (irreversible):
# `delonix volume rm truenas-dados --destroy-remote`.
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: truenas-dados
spec:
  provision:
    truenas:
      url: https://192.168.122.83    # required; the scheme is yours (http:// puts the key on the wire in clear)
      apiKeySecret: nas-creds        # Secret with key `apiKey` (or `token`); preferred over an account
      insecureTLS: true              # a stock TrueNAS serves a self-signed certificate
      dataset: tank/dados            # required: <pool>/<name>; the pool must already exist
      quota: 2G                      # quota ON THE NAS (min 1 GiB)
      owner:
        uid: 1000                    # required inside owner
        gid: 1000                    # required inside owner
        mode: "0770"                 # octal, quoted (a bare 0770 in YAML is decimal 770)
      share:                         # drop this block to provision without exporting
        networks: ["192.168.122.0/24"]   # CIDRs allowed to mount (must be non-empty)
        readOnly: false
        maprootUser: root
        maprootGroup: root

# ── 7b. provision.truenas: with account credentials instead of an API key ────
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: truenas-account
spec:
  provision:
    truenas:
      url: https://192.168.122.83
      username: truenas_admin        # account name
      passwordSecret: nas-creds      # Secret with key `password` (or inline `password:`)
      insecureTLS: true
      dataset: tank/account

# ── 8. pool: — a volume allocated in a storage pool (ADR-0067) ───────────────
# `pool` is the NAME of a `kind: StoragePool` (see storagepool.yaml). Needs a
# `size` (here the size IS the limit, there is no `quota`); exclusive with
# every other backing. The pool must be in the node's allowlist and applied
# first.
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: pg-data
spec:
  pool: fast                         # the `kind: StoragePool` named `fast`
  size: 10G                          # size asked of the pool (required with pool)
  alertPct: 85
