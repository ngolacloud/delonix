# ============================================================================
# kind: Bucket — S3-compatible object storage (ADR-0081; renamed from ObjectStorage, ADR-0086 D3)
#
# `ObjectStorage` still loads as a silent alias; `Bucket` is the canonical name.
#
# Two backends. `cephRgw` provisions a tenant S3 identity on the node's Ceph
# Object Gateway and writes its keys into a generated Secret (<name>-s3).
# `external` points at a foreign S3 you already run, with credentials from a
# Secret you provide. A workload consumes either the SAME way: endpoint +
# accessKey/secretKey read from the Secret.
#
# Apply:    delonix stack apply -f examples/storage/objectstorage.yaml
# ============================================================================

# ── 1. cephRgw — provision on the node's Ceph Object Gateway ─────────────────
---
apiVersion: storage.delonix.io/v1beta1
kind: Bucket
metadata:
  name: media
spec:
  backend: cephRgw            # provision on the node's RGW
  bucket: media               # the tenant creates it over S3 with the keys below
  cephRgw:
    uid: media                # S3 user id (default: metadata.name)
    displayName: Media store  # cosmetic label on the S3 identity
    endpoint: http://rgw.internal:80   # public S3 endpoint exposed to consumers
    quota:                    # optional ceiling on the tenant's total S3 usage
      maxSize: 100G           # total bytes across all buckets
      maxObjects: 100000      # total object count
  # On apply, credentials land in secret/media-s3 (accessKey, secretKey, endpoint, bucket).

# ── 2. external — bring your own S3 (AWS, MinIO, Backblaze, …) ───────────────
---
apiVersion: storage.delonix.io/v1beta1
kind: Bucket
metadata:
  name: backups
spec:
  backend: external
  bucket: company-backups
  external:
    endpoint: https://s3.eu-west-1.amazonaws.com
    region: eu-west-1         # only when the store needs one
    credentialsSecret: aws-s3 # existing Secret with accessKey + secretKey
