# ============================================================================
# kind: SystemContainer — a whole userland run as one unit on a provider node (ADR-0058)
#
# Not a `kind: Container`: no exec, logs or exit status. The generic part
#     (image, entrypoint, env, memory, cores, rootfs) is the intent; what only
#     the Proxmox node understands — the swap allowance and the node bridge/VLAN
#     — lives inline in `provider.spec` (ADR-0071). The engine pulls the image,
#     never the provider. The old spelling (`swap`/`network` at the top of
#     `spec`) still loads and means the same — just don't write a field twice.
#
# Apply:     delonix stack apply -f examples/compute/systemcontainer.yaml
# ============================================================================

# ── 1. provider block — Proxmox, with swap + bridge/DHCP inline ─────────────
---
apiVersion: proxmox.delonix.io/v1alpha1
kind: SystemContainer
metadata: { name: edge-dns }
spec:
  image: alpine:3.20            # the engine pulls it (never the provider)
  memory: 256M                  # RAM given to the userland
  cores: 1                      # CPU cores (cpuset)
  rootfs: 2                     # rootfs size in GiB
  provider:
    type: proxmox               # the only provider of this port
    spec:
      swap: 128M                # the container's swap allowance
      network: { bridge: vmbr0, dhcp: true }   # interface on a node bridge, IPv4 via DHCP

# ── 2. old spelling (swap/network at the top) + entrypoint/env and a VLAN ───
---
apiVersion: proxmox.delonix.io/v1alpha1
kind: SystemContainer
metadata: { name: edge-proxy }
spec:
  image: debian:12
  entrypoint: ["/usr/sbin/nginx", "-g", "daemon off;"]   # the container's init (empty => the image's)
  env:                          # environment (non-empty replaces the image's whole)
    TZ: Africa/Luanda
    LOG_LEVEL: info
  memory: 512M
  cores: 2
  rootfs: 4
  swap: 256M                    # old spelling — same as provider.spec.swap
  network:                      # old spelling — same as provider.spec.network
    bridge: vmbr1
    vlan: 20                    # optional VLAN tag of the interface
    dhcp: false                 # interface up with no address
