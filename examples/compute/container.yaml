# ============================================================================
# kind: Container — the everyday workload (flat and grouped shapes)
#
# `image` is the ONLY required field; everything else has a default. Fields
#     may be written flat at the top of `spec` (historic form) OR grouped by
#     concern (resources/network/security/storage/env/limits) — both shapes
#     describe the same container and are accepted. NOTE: the default of
#     `restartPolicy` is "no" (never restarts).
#
# The k8s shape (`spec.containers[]`) on a `kind: Container` is a sunset form
#     — use `kind: Pod` for that (see compute/pod.yaml).
#
# Apply:     delonix stack apply -f examples/compute/container.yaml
# ============================================================================

# ── 1. minimal — the only mandatory field ──────────────────────────────────
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: minimal
spec:
  image: alpine:3.20          # the only required field

# ── 2. grouped shape with the defaults made explicit ────────────────────────
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: web
spec:
  image: nginx:alpine         # required
  command: []                 # overrides the image CMD, e.g. ["nginx","-g","daemon off;"]
  entrypoint: null            # overrides the ENTRYPOINT ("" clears it)
  user: null                  # UID/GID or name, e.g. "1000:1000"
  hostname: null              # container hostname (default: the name)
  detach: true                # run in the background (a manifest is declarative)
  restartPolicy: "no"         # no (default) | on-failure[:max] | always | unless-stopped
  addHost: []                 # extra /etc/hosts entries, `name:ip`

  resources:                  # cgroup v2 limits
    memory: max               # 64M | 2G | max (no cap)
    cpus: "1.0"               # CPU cores
    cpuWeight: null           # relative CPU weight under contention (1-10000)
    cpuset: null              # pin to CPUs, e.g. "0-3"
    ioWeight: null            # relative I/O weight

  network:
    name: host                # host | none | <a network from `network create`>
    ports: []                 # ["8080:80"] — gives its own netns + slirp NAT
    expose: null              # HTTP port to auto-register in the L7 proxy (see kind: Gateway)
    alias: []                 # DNS aliases on the network
    knows: []                 # restrict name resolution to these containers
    rateBps: null             # egress rate limit (e.g. "10mbit"), custom network only
    rateBurst: null           # burst for rateBps

  security:
    privileged: false         # all caps, seccomp off — trusted only
    readOnly: false           # read-only rootfs (writes go to tmpfs/volumes)
    capAdd: []                # ["NET_ADMIN"]
    capDrop: []               # ["MKNOD"]
    securityOpt: []           # ["seccomp=unconfined","apparmor=<profile>"]
    apparmor: null            # AppArmor profile
    selinux: null             # SELinux context
    userns: false             # force the subuid userns (default-on in rootless)
    hostPid: false            # share the host PID namespace
    hostIpc: false            # share the host IPC namespace
    detect: false             # seccomp in log mode — discover syscalls

  storage:
    volumes: []               # ["data:/var/lib","/host/path:/inside:ro"]
    tmpfs: []                 # ["/scratch"]

  env:
    vars: []                  # ["KEY=value"]
    files: []                 # ["./.env"]
    secrets: []               # vault secret names (see `delonix secret`), injected as env
    secretFiles: false        # true → secrets to /run/secrets/<name> instead of env

  limits:
    devices: []               # ["/dev/fuse"]
    gpus: null                # all | nvidia | dri
    ulimit: []                # ["nofile=1024:2048"]
    sysctl: []                # ["net.core.somaxconn=1024"]

  labels: []                  # ["tier=frontend"]
  logDriver: null             # json | cri

# ── 3. supporting resources for the full scenarios below ────────────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: app-net
spec:
  driver: bridge
---
apiVersion: core.delonix.io/v1beta1
kind: Secret
metadata:
  name: app-secret
spec:
  stringData:
    DB_PASSWORD: change-me-example   # injected as env (or /run/secrets/, see secretFiles)
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: app-data
spec:
  driver: local
---
# a peer container so `knows:` has something to resolve.
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: peer
spec:
  image: busybox:latest
  command: ["sleep", "infinity"]
  network: app-net

# ── 4. full flat — every field at the top level of spec ─────────────────────
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: full-flat
  namespace: default                  # isolation namespace
  labels:                             # metadata labels (engine adds its own delonix.io/*)
    tier: frontend
  annotations:
    example.delonix.io/purpose: full-spec-demo
spec:
  image: nginx:alpine                 # REQUIRED (pulled if missing)
  detach: true                        # run in the background
  command: ["nginx", "-g", "daemon off;"]   # overrides the image CMD
  entrypoint: /docker-entrypoint.sh   # overrides the ENTRYPOINT ("" clears it)
  user: "101:101"                     # uid[:gid] or user name to run as
  hostname: full-flat-host            # hostname (default: the name)
  restartPolicy: on-failure:3         # no | on-failure[:max] | always | unless-stopped (legacy alias `restart`)
  addHost:                            # extra /etc/hosts entries, `name:ip`
    - legacy-api:10.0.0.9
  labels:                             # container labels `key=value` (spec-level, distinct from metadata.labels)
    - tier=frontend
    - team=platform

  # --- network ---
  network: app-net                    # host | none | <custom network> (custom => own netns on the SDN)
  ports:                              # publish host:container[/proto]; [hostIp:] and ranges too
    - "127.0.0.1:18080:80"
    - "18443:443/tcp"
    - "19000-19002:9000-9002"
  expose: 80                          # auto-register this HTTP port in the L7 proxy (needs a custom network)
  networkAlias:                       # extra DNS names on the custom network
    - web
    - frontend
  knows:                              # restrict reach to these peers (directed Dependency)
    - peer
  netBps: 10mbit                      # egress rate limit (needs a custom network)
  netBurst: 20mbit                    # burst for netBps

  # --- resources (cgroup v2) ---
  memory: 256M                        # 64M | 2G | max
  cpus: "0.5"                         # CPU cores
  cpuWeight: "200"                    # relative CPU weight under contention (1-10000)
  cpuset: "0"                         # pin to CPUs (needs the cpuset controller delegated)
  ioWeight: "100"                     # relative block-I/O weight
  cgroupParent:                       # shared intermediate cgroup bounding a GROUP of containers
    name: app-tier                    # a single safe path segment
    memoryMax: "1073741824"           # aggregate memory ceiling (bytes)
    cpus: "2"                         # aggregate CPU cores
    pidsMax: "512"                    # aggregate process ceiling

  # --- security ---
  readOnly: true                      # read-only rootfs
  capDrop: ["ALL"]                    # capabilities to drop
  capAdd: ["NET_BIND_SERVICE"]        # capabilities to add back
  securityOpt:                        # docker-style security options
    - no-new-privileges
  userns: true                        # force the subuid userns (already default in rootless)

  # --- storage ---
  volumes:                            # named volume or bind mount; optional :ro
    - app-data:/var/lib/app
    - /etc/hostname:/etc/host-name:ro
  tmpfs:                              # in-memory mounts
    - /tmp
    - /run/cache

  # --- environment ---
  env:                                # KEY=value list
    - TZ=Africa/Luanda
    - LOG_LEVEL=info
  secret:                             # vault secret names, injected as env (or files, below)
    - app-secret
  secretFiles: false                  # true => secrets as /run/secrets/<key> instead of env

  # --- misc limits ---
  ulimit:
    - nofile=1024:2048
  sysctl:
    - net.core.somaxconn=1024
  logDriver: json                     # json | cri

# ── 5. full grouped — the same fields, organised by concern ─────────────────
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: full-grouped
spec:
  image: nginx:alpine
  detach: true
  command: ["nginx", "-g", "daemon off;"]
  entrypoint: /docker-entrypoint.sh
  user: "101:101"
  hostname: full-grouped-host
  restartPolicy: always
  addHost: ["legacy-api:10.0.0.9"]
  labels: ["tier=frontend"]
  logDriver: json

  resources:                          # cgroup v2 limits
    memory: 256M
    cpus: "0.5"
    cpuWeight: "200"
    cpuset: "0"
    ioWeight: "100"
    cgroupParent:
      name: app-tier-grouped
      memoryMax: "1073741824"
      cpus: "2"
      pidsMax: "512"

  network:                            # a mapping here (a plain string is the flat form)
    name: app-net                     # host | none | <custom network>
    ports: ["18081:80"]
    expose: 80                        # auto-register in the L7 proxy
    alias: [web-grouped]              # => networkAlias
    knows: [peer]
    rateBps: 10mbit                   # => netBps
    rateBurst: 20mbit                 # => netBurst

  security:
    privileged: false                 # true => all caps, seccomp off (trusted only)
    readOnly: true
    capAdd: ["NET_BIND_SERVICE"]
    capDrop: ["ALL"]
    securityOpt: ["no-new-privileges"]
    userns: true
    hostPid: false                    # share the HOST pid namespace
    hostIpc: false                    # share the HOST ipc namespace
    detect: false                     # seccomp in log mode

  storage:
    volumes: ["app-data:/var/lib/app"]
    tmpfs: ["/tmp"]

  env:                                # grouped env (vars/files/secrets/secretFiles)
    vars: ["TZ=Africa/Luanda"]
    files: []                         # ["./.env"] — env files read at apply time
    secrets: [app-secret]
    secretFiles: true                 # secrets as /run/secrets/<key>

  limits:
    ulimit: ["nofile=1024:2048"]
    sysctl: ["net.core.somaxconn=1024"]
    devices: ["/dev/null:/dev/fuse-demo"]   # extra device nodes

# ── 6. env as a plain KEY: value mapping (what compose/k8s users write) ──────
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: env-map
spec:
  image: busybox:latest
  command: ["sleep", "infinity"]
  env:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: example-only
    PORT: 8080                        # non-strings are stringified

# ── 7. foreground — detach false blocks apply until the process exits ───────
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: foreground
spec:
  image: busybox:latest
  command: ["echo", "hello"]
  detach: false
  restartPolicy: "no"
