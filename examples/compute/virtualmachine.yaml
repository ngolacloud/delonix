# ============================================================================
# kind: VirtualMachine — a declarative VM (libvirt / Cloud Hypervisor / Proxmox)
#
# `disk` (a base image from the VM store, or a qcow2/raw path) is required
#     unless the image is BUILT from a VMfile (`spec.build`). Everything
#     hypervisor-neutral may be written flat at the top of `spec` OR grouped
#     (resources/network/boot/cloudInit); what only ONE hypervisor understands
#     goes under `provider: { type, spec }`. Base image: `delonix vm image ls`.
#
# Apply:     delonix stack apply -f examples/compute/virtualmachine.yaml
# ============================================================================

# ── 1. supporting resources — a 9p Volume, a NAS Volume and a Network ────────
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: vm-data                       # shared into the guest over virtio-9p (libvirt backend)
spec:
  driver: local
---
apiVersion: storage.delonix.io/v1beta1
kind: Volume
metadata:
  name: dados-nas                     # a network (NAS) volume mounted into the VM via 9p
spec:
  nfs:
    server: 10.0.0.5
    share: /mnt/pool/dados
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: vm-net                        # the SDN network the VM's tap joins (CH backend)
spec:
  driver: bridge

# ── 2. grouped shape with the defaults made explicit ────────────────────────
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: node1
spec:
  disk: k8s-golden              # required — base qcow2/raw (an overlay is made per VM)
  restartPolicy: null           # no | on-failure | always

  resources:
    vcpus: 2
    memory: 2G                  # "2G" | "1024M" (a "…i" suffix is accepted, k8s-style)
    hugepages: false
    cpuAffinity: null           # pin vCPUs, e.g. "8-15"

  network:
    name: vm-net                # ingress network for the VM's tap
    mode: null                  # libvirt only: user | nat | bridge
    bridge: null                # host bridge / libvirt network
    staticIp: null              # libvirt nat mode: DHCP reservation on the libvirt network

  # Boot mechanism: firmware (cloud images, the default) OR a direct kernel — pick one.
  boot:
    firmware: null              # UEFI firmware path (typical for cloud images)
    kernel: null                # direct kernel boot (alternative to firmware)
    initrd: null                # initramfs for direct kernel boot
    cmdline: null               # kernel cmdline for direct boot

  # cloud-init — full parity with `vm create`; a NoCloud seed ISO is auto-generated unless you hand it one via `seed`.
  cloudInit:
    seed: null                  # path to a prebuilt NoCloud ISO (overrides the fields below)
    hostname: null              # hostname applied on first boot
    sshKeys: []                 # authorized public keys: "ssh-ed25519 AAAA…" or "@/path"
    userData: null              # your own cloud-init user-data (path/@path) — replaces the generated one

  # The hypervisor and what only it understands. `type` picks the provider (omit the block = default); a key the type lacks is refused.
  provider:
    type: libvirt                # cloud-hypervisor | libvirt | proxmox
    spec:                        # libvirt: full XML parity, all optional
      machine: null                 # machine type (default q35)
      cpuModel: null                # host-passthrough (default) | host-model | a named model
      cpuTopology: null             # { sockets: 1, cores: 4, threads: 2 }
      tpm: false                    # add an emulated TPM 2.0
      video: null                   # virtio | qxl | vga | none
      bootOrder: []                 # e.g. [cdrom, hd]
      extraDisks: []                # [{ source, bus, format, readOnly }]
      extraNics: []                 # [{ type, source, model }]
      xmlOverlay: []                # raw <device> XML fragments (trusted manifests only)
      xml: null                     # full <domain> XML, used verbatim

  devices: []                   # VFIO PCI passthrough (sysfs paths) — CH + libvirt
  volumes: []                   # 9p mounts from a Volume: [{ name, mountPath, readOnly }]
  vnc: false                    # graphical console (libvirt backend only)

# ── 3. full flat — every field the libvirt backend understands ──────────────
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: full-flat
  namespace: default                  # isolation namespace (enforced on the CH backend only)
spec:
  disk: delonix-vm-base:ubuntu-24.04  # base image: a name in the VM store, or a path (overlay per VM)
  provider: { type: libvirt }         # cloud-hypervisor | libvirt | proxmox (omit = auto)
  restartPolicy: always               # no | on-failure | always
  vcpus: 4                            # omitted => the image's default, else 1
  memory: 4G                          # "512M" | "2G" | "2Gi"
  hugepages: false                    # back guest RAM with hugepages
  cpuAffinity: "0-3"                  # pin vCPUs to host CPUs
  network: vm-net                     # SDN network name (`ingress` is the built-in default)
  netMode: nat                        # libvirt only: user | nat | bridge (`nat` gives an observable IP)
  ip: 192.168.122.50                  # static IP: DHCP reservation on the libvirt network (nat mode only)
  vnc: true                           # graphical console (libvirt backend only)
  devices:                            # VFIO PCI passthrough, sysfs path
    - /sys/bus/pci/devices/0000:01:00.0

  # cloud-init: a NoCloud seed ISO is generated from these unless `seed` is given.
  hostname: full-flat                 # hostname applied on first boot
  sshKeys:                            # public keys: "ssh-ed25519 AAAA…" or "@/path.pub"
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleExampleExampleExampleExampleExample admin@example"
  userData: "@/etc/delonix/examples/user-data.yaml"   # your own user-data (path/@path); replaces the generated one

  # volumes shared into the guest over virtio-9p (`kind: Volume`, by name)
  volumes:
    - name: vm-data
      mountPath: /mnt/data            # where the guest mounts it
      readOnly: false

  # advanced libvirt knobs
  machine: q35                        # machine type (default q35)
  cpuModel: host-passthrough          # host-passthrough (default) | host-model | a model
  cpuTopology: { sockets: 1, cores: 2, threads: 2 }
  tpm: true                           # emulated TPM 2.0
  video: virtio                       # virtio | qxl | vga | none
  bootOrder: [hd, cdrom]              # OS boot device order
  extraDisks:                         # extra disks beyond the main overlay + seed
    - source: /var/lib/libvirt/images/extra.qcow2
      device: disk                    # disk (default) | cdrom
      bus: virtio                     # virtio (default) | sata | scsi | ide
      format: qcow2                   # qcow2 (default) | raw
      readOnly: false
      target: vdb                     # explicit target dev (auto when omitted)
  extraNics:                          # extra NICs beyond the primary one
    - type: network                   # network (libvirt network) | bridge (host) | user
      source: default
      model: virtio                   # virtio (default) | e1000 | …
      mac: "52:54:00:12:34:56"        # fixed MAC (random when omitted)
  libvirtXmlOverlay:                  # raw <device> fragments injected before </devices> (TRUSTED only)
    - "<rng model='virtio'><backend model='random'>/dev/urandom</backend></rng>"

# ── 4. full grouped — the same knobs, organised by concern ──────────────────
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: full-grouped
spec:
  disk: delonix-vm-base:ubuntu-24.04
  restartPolicy: on-failure
  devices: []                         # VFIO passthrough (stays top-level)
  volumes:                            # 9p mounts (stays top-level)
    - { name: vm-data, mountPath: /mnt/data, readOnly: true }
  vnc: true                           # stays top-level

  resources:
    vcpus: 2
    memory: 2G
    hugepages: false
    cpuAffinity: "0-1"

  network:                            # a mapping here (a plain string is the flat form)
    name: vm-net
    mode: nat                         # => netMode
    staticIp: 192.168.122.51          # => ip (nat mode)
    # bridge: br0                      # => bridge (host bridge, bridge mode) — see `bridge-vm`

  cloudInit:
    hostname: full-grouped
    sshKeys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleExampleExampleExampleExampleExample admin@example"]
    userData: "@/etc/delonix/examples/user-data.yaml"
    # seed: /path/seed.iso             # prebuilt seed — see `prebuilt-seed`

  provider:                           # the hypervisor and what only it understands
    type: libvirt
    spec:
      machine: q35
      cpuModel: host-model
      cpuTopology: { sockets: 1, cores: 2, threads: 1 }
      tpm: false
      video: qxl
      bootOrder: [hd]
      extraDisks:
        - { source: /var/lib/libvirt/images/scratch.raw, format: raw, bus: sata }
      extraNics:
        - { type: bridge, source: br0, model: e1000 }
      xmlOverlay:
        - "<memballoon model='virtio'/>"
      # xml: "<domain …>"              # whole <domain>, verbatim — see `raw-domain`

# ── 5. bridge mode — the VM attaches to a host bridge (mutually exclusive with a static ip, which is nat-only)
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: bridge-vm
spec:
  disk: delonix-vm-base:ubuntu-24.04
  provider: { type: libvirt }
  netMode: bridge
  bridge: br0                         # host bridge / libvirt network to attach to
  vcpus: 2
  memory: 2G

# ── 6. direct-kernel boot (alternative to firmware) — Cloud Hypervisor ──────
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: direct-kernel
spec:
  disk: delonix-vm-base:fedora-42
  provider: { type: cloud-hypervisor }
  network: vm-net
  kernel: /var/lib/delonix/kernels/vmlinuz-6.14.0     # direct kernel boot
  initrd: /var/lib/delonix/kernels/initramfs-6.14.0.img
  cmdline: "console=ttyS0 root=/dev/vda1 rw"          # kernel command line
  vcpus: 2
  memory: 2G

# ── 7. explicit UEFI firmware (the usual way to boot a cloud image) — Cloud Hypervisor
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: firmware-boot
spec:
  disk: delonix-vm-base:ubuntu-24.04
  provider: { type: cloud-hypervisor }
  network: vm-net
  firmware: /usr/local/share/delonix/CLOUDHV.fd       # UEFI firmware path
  vcpus: 2
  memory: 2G

# ── 8. prebuilt cloud-init seed — replaces the generated one (hostname/sshKeys/userData not set)
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: prebuilt-seed
spec:
  disk: delonix-vm-base:ubuntu-24.04
  seed: /var/lib/delonix/seeds/prebuilt-seed.iso      # NoCloud ISO handed to the guest as-is

# ── 9. escape hatch — the whole libvirt <domain> XML, used verbatim (TRUSTED only)
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: raw-domain
spec:
  disk: delonix-vm-base:ubuntu-24.04
  provider:
    type: libvirt
    spec:
      xml: |
        <domain type='kvm'>
          <name>raw-domain</name>
          <memory unit='MiB'>1024</memory>
          <vcpu>1</vcpu>
          <os><type arch='x86_64' machine='q35'>hvm</type></os>
        </domain>

# ── 10. the disk is BUILT from a VMfile (spec.build) — mutually exclusive with `disk`
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: built-disk
spec:
  build:
    context: .                        # build context, relative to THIS manifest's folder (default ".")
    file: VMfile                      # the VMfile (default <context>/VMfile)
    tag: built-disk:latest            # tag of the produced image, used as the VM's disk (default <name>:latest)
    compress: true                    # zstd-compress the result (default true)
    network: false                    # give the build network access (default false: reproducible)
  vcpus: 2
  memory: 2G

# ── 11. 9p volumes from a NAS — storage for a VM without writing cloud-init or XML
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata:
  name: app-vm
spec:
  disk: k8s-golden           # base image (qcow2/raw)
  vcpus: 2
  memory: 2G
  # only the libvirt backend materializes 9p; apply selects it when there are volumes (CH has no 9p).
  volumes:
    - name: dados-nas        # the NAS kind: Volume declared at the top
      mountPath: /mnt/dados  # where the VM mounts it
      readOnly: false
