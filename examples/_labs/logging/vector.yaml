# Delonix logging lab — the one collector that ships every resource's logs to
# every sink.
#
# This is the piece the runtime deliberately does NOT contain (see
# docs/ARCHITECTURE-SCOPE.md: "Runtime emits events; paas aggregates"). The
# runtime writes structured logs to files; THIS collector tails them,
# normalises each line to a common envelope (delonix_kind / delonix_id /
# delonix_name + a real timestamp), and fans them out to Loki, Elasticsearch
# and Graylog at once. Swap Vector for Fluent Bit / Promtail / otel-collector
# and the runtime side does not change — that is the whole point.
#
# Mounted read-only into the collector container:
#   <delonix-root>      -> /delonix        (the log files)
#   ./enrichment        -> /enrichment     (id -> name/image, generated by run.sh)

# Checkpoints live here; /tmp always exists in the image (a named volume works
# too, but the lab is disposable so an in-container path is fine).
data_dir: /tmp

# --- enrichment: container id (all the file path carries) -> name/image ------
enrichment_tables:
  containers:
    type: file
    file:
      path: /enrichment/containers.csv
      encoding:
        type: csv
    schema:
      id: string
      name: string
      image: string

sources:
  # Container stdout/stderr. With `--log-cri` each line is
  # "<rfc3339> <stream> <F|P> <body>"; without it, raw bytes.
  container_logs:
    type: file
    include:
      - /delonix/containers/*/log
    read_from: beginning

  # VM serial console, captured with `vm create --capture-serial`. The file is
  # "<vm-name>.serial" — directly under vms/ for the default namespace, or under
  # vms/<ns>/ otherwise. The resource name comes straight from the path.
  vm_serial:
    type: file
    include:
      - /delonix/vms/*.serial
      - /delonix/vms/*/*.serial
    read_from: beginning

  # The runtime's own structured event log (admissions, lifecycle, policy).
  events:
    type: file
    include:
      - /delonix/events.jsonl
    read_from: beginning

transforms:
  container_norm:
    type: remap
    inputs: [container_logs]
    source: |
      .delonix_kind = "container"
      .host = "delonix"
      id_match = parse_regex(.file, r'/containers/(?P<id>[^/]+)/log$') ?? {}
      .delonix_id = id_match.id || "unknown"
      # CRI line format when the container ran with --log-cri.
      cri, err = parse_regex(.message, r'^(?P<ts>\S+) (?P<stream>stdout|stderr) (?P<tag>[FP]) (?P<body>.*)$')
      if err == null {
        .delonix_stream = cri.stream
        .message = cri.body
        ts = parse_timestamp(cri.ts, "%+") ?? null
        if ts != null { .timestamp = ts }
      }
      # Enrich id -> name/image (CSV built by run.sh before the collector starts).
      # Fall back to the id so the name label is always present.
      .delonix_name = .delonix_id
      row, e = get_enrichment_table_record("containers", {"id": .delonix_id})
      if e == null {
        .delonix_name = row.name
        .delonix_image = row.image
      }

  vm_norm:
    type: remap
    inputs: [vm_serial]
    source: |
      .delonix_kind = "vm"
      .host = "delonix"
      # Match both vms/<name>.serial and vms/<ns>/<name>.serial.
      nm = parse_regex(.file, r'/vms/(?:[^/]+/)?(?P<name>[^/]+)\.serial$') ?? {}
      .delonix_name = nm.name || "unknown"
      .delonix_id = .delonix_name

  event_norm:
    type: remap
    inputs: [events]
    source: |
      .delonix_kind = "event"
      .host = "delonix"
      .delonix_name = "events"
      .delonix_id = "events"
      parsed, err = parse_json(.message)
      if err == null {
        . = merge(., object!(parsed))
        .delonix_kind = "event"
        .delonix_name = "events"
        .delonix_id = "events"
      }

sinks:
  # --- Loki (Grafana) ---------------------------------------------------------
  loki:
    type: loki
    inputs: [container_norm, vm_norm, event_norm]
    endpoint: http://localhost:3100
    labels:
      kind: "{{ delonix_kind }}"
      name: "{{ delonix_name }}"
      id: "{{ delonix_id }}"
    encoding:
      codec: text
    out_of_order_action: accept

  # --- Elasticsearch (ELK / Kibana) ------------------------------------------
  elasticsearch:
    type: elasticsearch
    inputs: [container_norm, vm_norm, event_norm]
    endpoints:
      - http://localhost:9200
    mode: bulk
    bulk:
      index: "delonix-logs-%Y.%m.%d"
    healthcheck:
      enabled: false

  # --- Graylog (GELF over TCP) -----------------------------------------------
  graylog:
    type: socket
    inputs: [container_norm, vm_norm, event_norm]
    address: localhost:12201
    mode: tcp
    encoding:
      codec: gelf
