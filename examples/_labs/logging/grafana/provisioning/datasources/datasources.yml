apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://localhost:3100
    isDefault: true
    jsonData:
      maxLines: 1000

  # The same logs Vector also ships to Elasticsearch — so Grafana can read both
  # the Loki stream and the ES index without leaving this one UI.
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://localhost:9200
    database: "delonix-logs-*"
    jsonData:
      index: "delonix-logs-*"
      timeField: "@timestamp"
      esVersion: "8.0.0"
