# lab-nas — TrueNAS SCALE, the lab's storage
#
#   1) the data disk must exist BEFORE the apply:
#        mkdir -p ~/.local/share/delonix/vms/labdata
#        qemu-img create -f qcow2 ~/.local/share/delonix/vms/labdata/nas-dados.qcow2 10G
#   2) delonix stack apply -f 50-nas.yaml
#
# The image's system disk is 20 GiB and that's all it is: system. TrueNAS
# refuses to create a pool on the disk where it is installed, so a NAS without a
# second disk boots, serves the interface and can't store anything — it's the
# `extraDisks` below that makes it a NAS for real.
#
# NOTE (appliance via manifest): TrueNAS does not run cloud-init. The CLI refuses
# `--hostname`/`--ssh-key` for an appliance; the manifest does not yet do that
# check and attaches a seed CD-ROM that the guest ignores. That is why there is
# no `hostname:` or `sshKeys:` here — you configure it via the web interface, which
# is how an appliance is configured.
apiVersion: delonix.io/v1
kind: Vm
metadata:
  name: lab-nas
spec:
  disk: truenas-scale:25.10
  vcpus: 2
  memory: 4G
  backend: libvirt
  netMode: nat
  # The data disk is added via `libvirtXmlOverlay` and not via `extraDisks`, and
  # the reason is concrete: TrueNAS refuses to create a pool with disks that have
  # no serial number ("Disks have duplicate serial numbers: None (vda, vdb)"), and
  # `extraDisks` has no field to set it. The overlay is the escape hatch for
  # exactly this case — raw XML, injected before `</devices>`.
  #
  # XML fragments are NOT validated: they can name any path on the host.
  # Only in a trusted manifest.
  libvirtXmlOverlay:
    - |
      <disk type='file' device='disk'>
        <driver name='qemu' type='qcow2'/>
        <source file='/home/walter/.local/share/delonix/vms/labdata/nas-dados.qcow2'/>
        <target dev='vdb' bus='virtio'/>
        <serial>LABDATA01</serial>
      </disk>
  extraNics:
    - type: network
      source: labnet
      model: virtio
      mac: "52:54:00:5a:b0:20"
