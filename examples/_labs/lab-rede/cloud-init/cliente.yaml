#cloud-config
# lab-cli — the workstation. It gets no fixed address on the lab NIC: it's
# `lab-dhcp` that hands it one, and that is exactly what this client is meant to PROVE.
hostname: lab-cli
fqdn: cli.lab.ngola

users:
  - name: delonix
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - SSH_KEY_PLACEHOLDER

package_update: true
packages:
  - smbclient
  - cifs-utils
  # Without this, `mount -t nfs` fails with "you might need a /sbin/mount.<type>
  # helper" — and what follows is worse than the error: whoever writes to the mount
  # point ends up writing to the LOCAL disk, looking like success.
  - nfs-common
  - bind9-dnsutils

write_files:
  - path: /etc/netplan/60-lab.yaml
    permissions: "0600"
    content: |
      network:
        version: 2
        ethernets:
          lab0:
            match:
              macaddress: "52:54:00:5a:b0:13"
            set-name: lab0
            dhcp4: true
            # The default route stays the one on eth0 (NAT), otherwise the
            # client would lose the internet to a LAN that does not route yet.
            dhcp4-overrides:
              use-routes: false
              use-dns: false

runcmd:
  - netplan apply
