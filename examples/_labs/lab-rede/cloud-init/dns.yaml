#cloud-config
# lab-dns — authoritative DNS server (BIND 9) for the lab.ngola zone
#
# `spec.userData` REPLACES the user-data that delonix would generate, so the
# account and the key have to come from here: without them, the VM boots with no
# way to log in.
hostname: lab-dns
fqdn: ns.lab.ngola

users:
  - name: delonix
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - SSH_KEY_PLACEHOLDER

package_update: true
packages:
  - bind9
  - bind9-utils
  - bind9-dnsutils

write_files:
  # The 2nd NIC (the lab one) matches by MAC and not by name: `enp1s0`/`enp2s0`
  # depend on the order in which PCI enumerates them, and that order is not a contract.
  - path: /etc/netplan/60-lab.yaml
    permissions: "0600"
    content: |
      network:
        version: 2
        ethernets:
          lab0:
            match:
              macaddress: "52:54:00:5a:b0:10"
            set-name: lab0
            addresses: [10.50.0.10/24]

  - path: /etc/bind/named.conf.local
    content: |
      zone "lab.ngola" {
          type master;
          file "/etc/bind/db.lab.ngola";
      };
      zone "0.50.10.in-addr.arpa" {
          type master;
          file "/etc/bind/db.10.50.0";
      };

  - path: /etc/bind/db.lab.ngola
    content: |
      $TTL    300
      @       IN      SOA     ns.lab.ngola. admin.lab.ngola. (
                                    1         ; Serial
                                  300         ; Refresh
                                  120         ; Retry
                                60480         ; Expire
                                  300 )       ; Negative Cache TTL
      @       IN      NS      ns.lab.ngola.
      ns      IN      A       10.50.0.10
      dhcp    IN      A       10.50.0.11
      dc      IN      A       10.50.0.12
      nas     IN      A       10.50.0.20
      fw      IN      A       10.50.0.254

  - path: /etc/bind/db.10.50.0
    content: |
      $TTL    300
      @       IN      SOA     ns.lab.ngola. admin.lab.ngola. (
                                    1 300 120 60480 300 )
      @       IN      NS      ns.lab.ngola.
      10      IN      PTR     ns.lab.ngola.
      11      IN      PTR     dhcp.lab.ngola.
      12      IN      PTR     dc.lab.ngola.
      20      IN      PTR     nas.lab.ngola.
      254     IN      PTR     fw.lab.ngola.

  # Answers the lab LAN and forwards whatever isn't its own. `dnssec-validation no`
  # because the lab.ngola zone does not exist at the root and cannot be validated.
  - path: /etc/bind/named.conf.options
    content: |
      options {
          directory "/var/cache/bind";
          listen-on { 127.0.0.1; 10.50.0.10; };
          listen-on-v6 { none; };
          allow-query { 127.0.0.1; 10.50.0.0/24; };
          recursion yes;
          allow-recursion { 127.0.0.1; 10.50.0.0/24; };
          forwarders { 8.8.8.8; 1.1.1.1; };
          dnssec-validation no;
      };

runcmd:
  - netplan apply
  - systemctl enable --now named
  - systemctl restart named
