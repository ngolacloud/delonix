#cloud-config
# lab-dhcp — DHCP server (ISC) for the LAN 10.50.0.0/24
hostname: lab-dhcp
fqdn: dhcp.lab.ngola

users:
  - name: delonix
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - SSH_KEY_PLACEHOLDER

package_update: true
packages:
  - isc-dhcp-server

write_files:
  - path: /etc/netplan/60-lab.yaml
    permissions: "0600"
    content: |
      network:
        version: 2
        ethernets:
          lab0:
            match:
              macaddress: "52:54:00:5a:b0:11"
            set-name: lab0
            addresses: [10.50.0.11/24]

  # Serves ONLY on the lab NIC. Without this line dhcpd also listens on `default`,
  # where there is already a libvirt DHCP server — two servers in the same broadcast
  # domain hand out whichever reply arrives first.
  - path: /etc/default/isc-dhcp-server
    content: |
      INTERFACESv4="lab0"
      INTERFACESv6=""

  - path: /etc/dhcp/dhcpd.conf
    content: |
      default-lease-time 600;
      max-lease-time 7200;
      ddns-update-style none;
      authoritative;

      subnet 10.50.0.0 netmask 255.255.255.0 {
        range 10.50.0.100 10.50.0.200;
        option routers 10.50.0.254;              # the OPNsense, once it exists
        option domain-name-servers 10.50.0.10;   # the lab BIND
        option domain-name "lab.ngola";
      }

      # Reservation by MAC: the lab client always has the same address, which
      # keeps the DNS record and the firewall rules stable.
      host lab-cli {
        hardware ethernet 52:54:00:5a:b0:13;
        fixed-address 10.50.0.50;
      }

runcmd:
  - netplan apply
  # dhcpd refuses to start if the NIC does not yet have an address; the netplan
  # above has just given it one, and this ordering is what makes the startup reliable.
  - systemctl enable isc-dhcp-server
  - systemctl restart isc-dhcp-server
