# lab-fw — OPNsense, the lab's firewall
#
#   delonix stack apply -f 70-firewall.yaml
#
# The ORDER of the NICs is what decides the roles, and it's easy to swap it
# without noticing: OPNsense calls the first NIC (`vtnet0`) LAN and the second
# (`vtnet1`) WAN. Therefore:
#
#   primary   → `labnet`   = vtnet0 = LAN  (the network the firewall protects)
#   extraNic  → `default`  = vtnet1 = WAN  (the uplink, libvirt NAT)
#
# Unlike the lab's other VMs, the primary NIC is NOT `default`. A firewall with
# the WAN on vtnet0 ends up with its rules inverted — protecting the internet
# from the lab, rather than the other way round.
#
# No `hostname`/`sshKeys`: it's an appliance, doesn't run cloud-init, and the
# engine refuses those fields rather than accepting and ignoring them. You
# configure it on the console (`delonix vm console lab-fw`) or the web interface.
apiVersion: delonix.io/v1
kind: Vm
metadata:
  name: lab-fw
spec:
  disk: opnsense:26.1
  vcpus: 2
  memory: 3G
  backend: libvirt
  netMode: nat
  bridge: labnet          # the primary NIC goes to the lab LAN
  extraNics:
    - type: network
      source: default     # the second is the WAN, with uplink to the internet
      model: virtio
