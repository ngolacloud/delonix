# Lab storage, provisioned ON the NAS from the manifest.
#
#   delonix stack apply -f 60-storage.yaml
#
# What this does on the appliance, without anyone opening the web interface: it
# creates the dataset, applies its quota, sets owner/mode and publishes the NFS
# export. What it does NOT do is create the pool — laying out physical disks is
# not something a volume manifest should trigger (see ADR-0009). The `labpool`
# pool is created once:
#
#   curl -sk -u truenas_admin:<pass> -H 'Content-Type: application/json' \
#     -X POST https://<nas>/api/v2.0/pool \
#     -d '{"name":"labpool","topology":{"data":[{"type":"STRIPE","disks":["vdb"]}]}}'
---
apiVersion: delonix.io/v1
kind: Secret
metadata:
  name: nas-cred
spec:
  stringData:
    password: delonix-admin
---
apiVersion: delonix.io/v1
kind: Volume
metadata:
  name: lab-dados
spec:
  provision:
    truenas:
      # HTTPS and not HTTP: the credential travels in this request. The engine
      # REFUSES `http://` with a credential, precisely so it does not travel in the clear.
      url: https://NAS_IP
      username: truenas_admin
      passwordSecret: nas-cred
      # A factory TrueNAS serves a certificate that this host does not validate.
      # Turning this on means accepting that risk on this network.
      insecureTLS: true
      dataset: labpool/lab-dados
      quota: 2G          # minimum accepted by the appliance: 1 GiB
      # Dataset owner and mode. Without this the dataset belongs to the appliance's
      # root with mode 0755, and a client that mounts it sees it but can't write to it.
      owner:
        uid: 1000
        gid: 1000
        mode: "0770"
      share:
        networks:
          - 10.50.0.0/24
          - 192.168.122.0/24
        # NFS does root-squash by default: the client's root reaches the NAS as
        # `nobody`. Mapping it to root is the classic `no_root_squash` — convenient
        # in a lab, and a real security concession outside it: whoever is root on a
        # machine that can mount this is root on the data.
        maprootUser: root
        maprootGroup: root
