# ============================================================================
# kind: Config — a bag of KEY=value pairs in CLEARTEXT, the Secret's sibling (ADR-0086 D3 / ADR-0090)
#
# A Config is the engine's ConfigMap form: it holds NON-secret data (log
# levels, feature flags, URLs) in CLEARTEXT on disk
# (`<root>/configs/<name>.json`, 0644) — never encrypted. That is what
# separates it from a Secret. It is consumed by `Container.config` (as env or
# /run/config/<key> files), exactly like `Container.secret`.
#
# DECLARATIVE — there is no `delonix config` verb (the engine already uses that
# name for the local preference). Apply it with `stack apply -f` and
# read/remove it through the generic verbs: `delonix get configs`,
# `delonix describe config <name>`, `delonix delete config <name>`.
#
# Sources — `data` (inline, cleartext, NO warning), `fromEnvFile`, `fromEnv` —
# combinable in one document, with the same precedence as a Secret.
#
# Apply:    delonix stack apply -f examples/core/config.yaml
#   Configs are applied BEFORE whatever references them (right after Secrets).
# ============================================================================

# ── 1. data — inline, cleartext (that is the point of a Config) ──────────────
---
apiVersion: core.delonix.io/v1beta1
kind: Config
metadata:
  name: app-tuning
  labels:
    app: demo
spec:
  data:
    LOG_LEVEL: debug              # injected as env into the container
    FEATURE_FLAGS: "beta,metrics" # cleartext value, shown by `describe config`

# ── 2. fromEnvFile — load KEY=value lines from a file ────────────────────────
---
apiVersion: core.delonix.io/v1beta1
kind: Config
metadata:
  name: app-settings
spec:
  fromEnvFile: ./config-source.env   # resolved against the manifest's folder

# ── 3. A Container that CONSUMES the config (env), exactly like a Secret ──────
# `config: [app-tuning]` resolves the Config's keys to environment variables
# at startup. With `configFiles: true` they would go to /run/config/<key>.
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: demo-app
spec:
  image: busybox:latest
  command: ["sh", "-c", "echo LOG_LEVEL=$LOG_LEVEL FEATURE_FLAGS=$FEATURE_FLAGS; sleep 3600"]
  config:                         # Config names, injected as env
    - app-tuning
  configFiles: false              # true => configs as /run/config/<key> instead of env
