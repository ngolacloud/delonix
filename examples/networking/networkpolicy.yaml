# ============================================================================
# kind: NetworkPolicy — declarative L4 firewall (k8s NetworkPolicy style)
#
# Direction is `spec.direction` (ingress|egress) and reach is `spec.scope`.
# Each document is the DESIRED STATE of ONE direction of ONE target: applying
# it REPLACES that direction's rules (allowlist + default), leaving the other
# untouched — so two documents for the same (target, direction) are refused.
# `scope: container` (default) acts on a workload; `scope: network` is a whole
# network's EGRESS policy (egress only); `scope: vm` is the firewall of the
# node the VM runs on (ADR-0052). It only acts on workloads on a custom SDN.
#
# NOTE: `kind: Ingress` is NO LONGER firewall — it is now the k8s-shaped L7/HTTP
# Ingress (host/path→backend, see examples/gateway/ingress.yaml). And `kind: Egress`
# was REMOVED — the load REFUSES it, naming `direction: egress` as the replacement:
# no known model splits inbound from outbound into TYPES, so direction is a field,
# with one struct, one validator and one apply.
#
# spec fields: direction, scope, target, defaultPolicy, rules[], allowCidrs,
# fqdnAllowlist, rateLimit. Per-rule fields (scope container/vm): proto, port,
# action, from, fromWorkload, to, toWorkload, note. allowCidrs/fqdnAllowlist/
# rateLimit are for scope: network only.
#
# Apply:    delonix stack apply -f examples/networking/networkpolicy.yaml
# ============================================================================

# ── 0. Supporting resources INLINE — networks and workloads the policies protect
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: sdn-demo }
spec: { driver: bridge }
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: sdn-locked }
spec: { driver: bridge }
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: db }
spec:
  network: sdn-demo            # the L4 firewall only acts on workloads on the SDN
  containers:
    - name: db
      image: "postgres:16-alpine"
      env:
        - { name: POSTGRES_PASSWORD, value: example }
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: app }
spec:
  network: sdn-demo
  containers:
    - name: app
      image: "alpine:3.19"
      command: ["sleep", "infinity"]
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: cache }
spec:
  network: sdn-demo
  containers:
    - name: cache
      image: "redis:7-alpine"

# ── 1. INGRESS allowlist (scope container) — every ingress-side rule form ────
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkPolicy
metadata: { name: db-inbound }
spec:
  direction: ingress           # ingress (inbound) | egress (outbound)
  scope: container             # container (default): `target` is a workload name
  target: db                   # the workload the policy protects
  defaultPolicy: deny          # allow | deny when no rule matches (default for scope container: deny)
  rules:
    - proto: tcp               # tcp | udp | any (default any)
      port: "5432"             # a single port
      from: 10.219.0.0/16      # source CIDR
      action: allow            # allow (default) | deny
      note: postgres-from-sdn  # free-text label, shown in listings
    - proto: tcp
      port: "5432"
      fromWorkload: app        # source BY WORKLOAD NAME (resolved to its SDN address at apply; survives restarts). Exclusive with from/to.
      note: postgres-from-app
    - proto: udp
      port: "8000-8100"        # a port range n-m
      from: 10.219.5.0/24
      note: udp-range
    - proto: any               # any protocol
      port: "*"                # any port
      from: 10.219.9.9/32
      action: deny             # an explicit deny, evaluated by rule order
      note: block-this-host

# ── 2. INGRESS with defaultPolicy allow — only the listed denies apply ───────
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkPolicy
metadata: { name: cache-inbound-open }
spec:
  direction: ingress
  target: cache
  defaultPolicy: allow         # everything not listed is accepted
  rules:
    - port: "6379"             # proto omitted = any
      from: 203.0.113.0/24
      action: deny
      note: no-external-redis

# ── 3. EGRESS allowlist for a workload — a CIDR, a workload name and a wildcard
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkPolicy
metadata: { name: app-outbound }
spec:
  direction: egress
  target: app
  defaultPolicy: deny
  rules:
    - proto: udp
      port: "53"
      note: dns
    - proto: tcp
      port: "443"
      to: 0.0.0.0/0            # destination CIDR (egress-side counterpart of `from`)
      note: https-anywhere
    - proto: tcp
      port: "5432"
      toWorkload: db           # destination BY WORKLOAD NAME (egress counterpart of fromWorkload)
      note: postgres-to-db

# ── 4. Minimal EGRESS — no rules, default deny → no outbound possible ────────
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkPolicy
metadata: { name: cache-outbound-locked }
spec:
  direction: egress
  target: cache
  defaultPolicy: deny

# ── 5. PER-NETWORK EGRESS (scope: network, egress only) — `target` is a NETWORK
#
# CIDR allowlist + FQDN allowlist (learnt live from DNS) + global L4 rate limit
# of the rootless ingress. The declarative form of `delonix net egress`.
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkPolicy
metadata: { name: sdn-locked-egress }
spec:
  direction: egress
  scope: network               # container (default) | network
  target: sdn-locked           # a NETWORK name, not a workload
  defaultPolicy: deny          # allowCidrs/fqdnAllowlist only make sense with deny
  allowCidrs:                  # destinations allowed besides DNS
    - 10.0.0.0/8
    - 198.51.100.0/24
  fqdnAllowlist:               # hostnames allowed (and `*.host`), via DNS snooping
    - registry.example.com
    - updates.example.org
  rateLimit:                   # GLOBAL L4 guard of the rootless ingress (not per network)
    connRate: 100              # new connections per second allowed
    connMax: 2000              # maximum concurrent connections

# ── 6. PER-NETWORK EGRESS fully open (defaultPolicy allow) ───────────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkPolicy
metadata: { name: sdn-demo-egress-open }
spec:
  direction: egress
  scope: network
  target: sdn-demo
  defaultPolicy: allow

# ── 7. scope: vm — the firewall of the node the VM runs on (ADR-0052) ────────
#
# Today that is a Proxmox node; a libvirt/Cloud Hypervisor VM refuses the policy
# with the reason. Needs a registered Proxmox target (DELONIX_PROXMOX_URL/_NODE
# + credential) and the DATACENTER firewall already on (the engine never flips
# that switch). Rules are evaluated IN ORDER on the node (first match wins),
# above any hand-added rule, which is never touched.
---
apiVersion: compute.delonix.io/v1beta1
kind: VirtualMachine
metadata: { name: web-vm }
spec:
  provider: { type: proxmox }
  disk: "local-lvm:8"
  vcpus: 2
  memory: 2G
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkPolicy
metadata: { name: web-vm-in }
spec:
  scope: vm
  target: web-vm
  direction: ingress
  defaultPolicy: deny
  rules:
    - { proto: tcp, port: "22", from: 10.0.0.0/8, note: "ssh from the admin network" }
    - { proto: tcp, port: "443" }
    - { port: "53", from: 10.0.0.0/8 }   # any protocol + a port = TCP and UDP
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkPolicy
metadata: { name: web-vm-out }
spec:
  scope: vm
  target: web-vm
  direction: egress
  defaultPolicy: allow
  rules:
    - { proto: tcp, port: "25", action: deny, note: "no direct mail out" }
