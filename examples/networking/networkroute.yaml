# ============================================================================
# kind: NetworkRoute — a DIRECTED path between two NETWORKS (ADR-0013 tier B)
#
# Networks are isolated by default. This declares that one MAY reach the other
# — directed, like `kind: Dependency` between containers: `from` initiates and
# the return flows (established); `to` does NOT initiate back. The spec has
# EXACTLY two fields, `from` and `to` — there is no `via`. Identity is the PAIR
# (from->to), not metadata.name; two documents for the same pair are refused.
#
# A route says the packet MAY cross; never that it is ALLOWED. Per-workload
# policy (NetworkPolicy/Dependency) still decides. Two questions in series — hence
# two Kinds: NetworkRoute (is there a path?) then the policy (is it accepted?).
# `stack apply --prune` closes routes removed from the manifest.
#
# Apply:    delonix stack apply -f examples/networking/networkroute.yaml
# Equivalent imperative:   delonix network route <from> <to>   (and `--rm` to close)
# ============================================================================

# ── 0. Supporting resources INLINE — the networks the routes connect ─────────
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: frontend }
spec: { driver: bridge }
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: backend }
spec: { driver: bridge }
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: mgmt }
spec: { driver: bridge }

# ── 1. one-way path — frontend may initiate towards backend ──────────────────
#
# Return traffic of those conversations flows; backend cannot initiate back.
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkRoute
metadata:
  name: frontend-to-backend
  labels:
    purpose: app-traffic       # metadata is free-form; only spec.from/spec.to matter
spec:
  from: frontend               # network that may INITIATE
  to: backend                  # network reached

# ── 2. a second independent pair — mgmt reaches both others ──────────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkRoute
metadata: { name: mgmt-to-backend }
spec:
  from: mgmt
  to: backend
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkRoute
metadata: { name: mgmt-to-frontend }
spec:
  from: mgmt
  to: frontend

# ── 3. a bidirectional path is two explicit routes (the reverse pair) ────────
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkRoute
metadata: { name: backend-to-mgmt }
spec:
  from: backend
  to: mgmt

# ── 4. the 2nd question — does `api` ACCEPT the crossing? (per-workload policy)
#
# The workloads exist so the "is it allowed?" question has something to protect.
# Without this Dependency the path exists but `api` still decides who it accepts.
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: web }
spec:
  network: frontend
  containers:
    - name: web
      image: "alpine:3.19"
      command: ["sleep", "infinity"]
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: api }
spec:
  network: backend
  containers:
    - name: api
      image: "alpine:3.19"
      command: ["sleep", "infinity"]
---
apiVersion: networking.delonix.io/v1beta1
kind: Dependency
metadata: { name: web-knows-api }
spec:
  from: web
  to: api
  ports: ["8080"]
  proto: tcp
