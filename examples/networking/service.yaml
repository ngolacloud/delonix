# ============================================================================
# kind: Service (ADR-0032) — a set of workloads picked by label
#
# `type: DNS` (default) publishes the set as MULTIPLE DNS `A` records under
# <name>.<namespace>.delonix.internal, in rotating order (round-robin) — no
# VIP, no L4 dataplane, no daemon. `type: VirtualIP` (ADR-0066) takes ONE
# address from the operator's VIP pool; the name resolves to that address and
# the holder DNATs each new connection to a ready backend. Membership is
# recomputed within a DNS-index TTL (~2s): a workload added, removed or
# relabelled shows up without re-applying.
#
# spec fields: selector.matchLabels (logical AND), port (the CONTAINER-side
# port, never a host/VIP port), type, vip, readiness, publish. An empty/no-match
# selector resolves to an empty set — not an error, but apply warns.
#
# Apply:    delonix stack apply -f examples/networking/service.yaml
# ============================================================================

# ── 0. Supporting resources INLINE — the network and workloads the Services pick
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: appnet }
spec: { driver: bridge }
---
apiVersion: compute.delonix.io/v1beta1
kind: Workload
metadata:
  name: web-1
  labels: { app: web, tier: frontend, track: stable }   # labels flow through Workload → labelled container
spec:
  type: container
  container: { image: "nginx:alpine", network: appnet }
---
apiVersion: compute.delonix.io/v1beta1
kind: Workload
metadata:
  name: web-2
  labels: { app: web, tier: frontend, track: canary }
spec:
  type: container
  container: { image: "nginx:alpine", network: appnet }
---
apiVersion: compute.delonix.io/v1beta1
kind: Workload
metadata:
  name: api-1
  namespace: team-a            # a namespace other than `default`
  labels: { app: api }
spec:
  type: container
  container: { image: "caddy:alpine", network: appnet }

# ── 1. single-label selector, namespace `default` ───────────────────────────
#
# Clients resolve web.default.delonix.internal and get web-1 and web-2 in rotation.
---
apiVersion: networking.delonix.io/v1beta1
kind: Service
metadata:
  name: web
  namespace: default
spec:
  selector:
    matchLabels:
      app: web                 # every listed label must match
  port: 80                     # container-side port the members listen on

# ── 2. multi-label selector — narrows the set to the stable track only (web-1) ─
---
apiVersion: networking.delonix.io/v1beta1
kind: Service
metadata:
  name: web-stable
spec:                          # namespace omitted = `default`
  selector:
    matchLabels:
      app: web
      track: stable
  port: 80

# ── 3. Service in another namespace — resolves as api.team-a.delonix.internal ─
#
# Namespace isolation applies to DNS: other namespaces get NXDOMAIN (except
# services in `default`).
---
apiVersion: networking.delonix.io/v1beta1
kind: Service
metadata:
  name: api
  namespace: team-a
spec:
  selector:
    matchLabels:
      app: api
  port: 8080

# ── 4. type: VirtualIP (ADR-0066) — ONE address from the operator's VIP pool ─
#
# The name resolves to that address and the holder DNATs each new connection
# to a READY backend (random numgen). Ready = the port accepts a TCP connect
# from the holder AND (if declared) is healthy. Pool set via
# `delonix network vip-pool set`.
---
apiVersion: networking.delonix.io/v1beta1
kind: Service
metadata:
  name: web-vip
  namespace: default
spec:
  selector:
    matchLabels:
      app: web                 # same backends as #1: web-1 and web-2
  port: 80                     # container-side port (= the VIP port; a single one in v1)
  type: VirtualIP              # DNS (default) | VirtualIP
  vip: 10.80.0.5               # dotted IPv4 inside the pool; omit = IPAM picks
  readiness:                   # knobs of the TCP readiness probe (all optional)
    tcp:
      intervalSeconds: 2       # default 2 s
      timeoutMilliseconds: 500 # default 500 ms
      successThreshold: 1      # successes to admit; default 1
      failureThreshold: 2      # failures to eject; default 2
  publish: [8080, 8443]        # host ports that lead to the VIP's backends (127.0.0.1 unless DELONIX_PUBLISH_ADDR)
