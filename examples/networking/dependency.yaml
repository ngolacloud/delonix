# ============================================================================
# kind: Dependency (alias: KnowDepends) — DIRECTED reachability between workloads
#
# Unlike a Network (bidirectional), it opens ONE direction: `from` reaches `to`,
# but `to` does NOT initiate towards `from` — and `to` stops being exposed to
# everyone else on the network. Classic case: the app knows the DB, the DB does
# not know the app. It is SUGAR: at load each Dependency is rewritten into a
# `kind: NetworkPolicy` with `direction: ingress` on `to` (default-deny + one
# allow per `from`, naming the peer by WORKLOAD so it survives restarts). Several
# Dependencies for the same `to` accumulate and merge into one policy. Run
# `delonix stack apply --dry-run` to see the real policy.
#
# spec fields: from (required, string), to (string or list), ports (list), proto.
# The rule names the peer by workload, not by IP — a container's address comes
# from the SDN and changes on a restart.
#
# Apply:    delonix stack apply -f examples/networking/dependency.yaml
# ============================================================================

# ── 0. Supporting resources INLINE — the network and the workloads ───────────
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: appnet }
spec: { driver: bridge }
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: db }
spec:
  network: appnet
  containers:
    - name: db
      image: "postgres:16-alpine"
      env:
        - { name: POSTGRES_PASSWORD, value: example }
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: cache }
spec:
  network: appnet
  containers:
    - name: cache
      image: "redis:7-alpine"
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: app }
spec:
  network: appnet
  containers:
    - name: app
      image: "alpine:3.19"
      command: ["sleep", "infinity"]
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: worker }
spec:
  network: appnet
  containers:
    - name: worker
      image: "alpine:3.19"
      command: ["sleep", "infinity"]

# ── 1. every field, `to` as a single name — app may reach db on TCP/5432 only
---
apiVersion: networking.delonix.io/v1beta1
kind: Dependency
metadata: { name: app-knows-db }
spec:
  from: app                    # who INITIATES (the one that "knows")
  to: db                       # the protected target
  ports: ["5432"]              # ports of `to` opened to `from`; empty/omitted = any
  proto: tcp                   # tcp | udp | any (default any)

# ── 2. `to` as a LIST — one declaration protecting two targets at once ───────
---
apiVersion: networking.delonix.io/v1beta1
kind: Dependency
metadata: { name: app-knows-cache }
spec:
  from: app
  to: [cache, worker]
  ports: ["6379", "9000"]      # several ports
  proto: tcp

# ── 3. accumulation — a second `from` for the same `to` (db) ─────────────────
#
# Merged with document 1, db accepts app (5432/tcp) AND worker (any port, any proto).
---
apiVersion: networking.delonix.io/v1beta1
kind: Dependency
metadata: { name: worker-knows-db }
spec:
  from: worker
  to: db
