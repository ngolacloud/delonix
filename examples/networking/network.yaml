# ============================================================================
# kind: Network — a user-defined network; containers join it with `--net <name>`
#
# A native `Network` is a node-local L2/L3 plane chosen by `driver`: `bridge`
# (default, a local bridge), `overlay` (VXLAN between nodes, optionally
# WireGuard-encrypted), `macvlan`/`ipvlan` (an address directly on the parent
# NIC's segment). The SAME kind also describes a segment realized by a cluster
# provider (Proxmox/SDN) — then it carries `spec.provider` and no native field;
# the document never names the infra endpoint (it comes from the provider the
# runtime has configured).
#
# Native spec fields: driver, subnet, gateway, parent, vni, peers, wgIp
# (alias wg_ip). No field is invented — these are NETWORK_SPEC_FIELDS.
#
# Apply:    delonix stack apply -f examples/networking/network.yaml
# ============================================================================

# ── 1. bridge — every bridge-relevant field spelled out ──────────────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: net-bridge-full
  labels:
    tier: backend             # free-form labels (ownership stamps are added by apply)
  annotations:
    example.io/purpose: "all bridge fields"
spec:
  driver: bridge              # bridge (default) | macvlan | ipvlan | overlay
  subnet: 10.201.0.0/16       # CIDR of the network; omit to auto-pick a free /16
  gateway: 10.201.0.1         # gateway address; omit to default to .1 of the subnet

# ── 2. bridge default — everything omitted, driver=bridge, subnet auto-picked ─
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: net-bridge-default
spec: {}                      # driver defaults to bridge, subnet is auto-picked

# ── 3. overlay (VXLAN) between nodes — vni + peers, clear-text ───────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: net-overlay-plain
spec:
  driver: overlay
  vni: 42                     # VXLAN network identifier
  peers:                      # other nodes of the overlay, by underlay IP
    - 192.168.1.11
    - 192.168.1.12

# ── 4. encrypted overlay (WireGuard transport) — peers "<ip>=<wg_pubkey>=<wg_ip>"
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: net-overlay-encrypted
spec:
  driver: overlay
  vni: 77
  wgIp: 10.250.0.1            # this node's WireGuard tunnel IP (alias: wg_ip)
  peers:
    - "192.168.1.11=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==10.250.0.2"

# ── 5. macvlan — the container gets an address on the parent NIC's L2 segment ─
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: net-macvlan
spec:
  driver: macvlan
  parent: eth0                # host NIC the macvlan sits on
  subnet: 192.168.50.0/24
  gateway: 192.168.50.1

# ── 6. ipvlan — like macvlan, but all share the parent's MAC ─────────────────
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: net-ipvlan
spec:
  driver: ipvlan
  parent: eth0
  subnet: 192.168.60.0/24

# ── 7. provider Proxmox/SDN — segment realized by a cluster provider ─────────
#
# NOT `kind: NetworkZone` — it is `kind: Network` with `spec.provider` (ADR-0070,
# ADR-0071). Everything outside `provider` is neutral; `provider.spec` is typed
# for the provider `provider.type` names, and a key it does not have is refused.
# metadata.name is the vnet's SDN id. `zone` is shared by its vnets (created with
# the first, removed with the last); whatever `dns` says must be identical on
# every network of that zone. With no provider configured `apply` refuses;
# `stack validate` does not need one.
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: labnet1 }
spec:
  subnet: 10.80.0.0/24
  gateway: 10.80.0.1
  provider:
    type: proxmox             # the provider that realizes the segment
    spec:
      zone: lab               # the SDN zone this vnet lives in
      alias: "lab network 1"  # the vnet's SDN alias
      dhcpRange: [{ start: 10.80.0.100, end: 10.80.0.150 }]   # the vnet's DHCP range
      reservations:
        - { ip: 10.80.0.20, mac: "BC:24:11:00:00:20" }        # reservation by literal MAC
        - { ip: 10.80.0.21, workload: "VirtualMachine/web-1" } # or by VM workload (MAC resolved once the VM exists)
      dns:                    # per zone (all networks of the zone must agree)
        server: pdns          # DNS controller registered on the cluster (the engine never creates one)
        zone: lab.example     # the DNS zone the A/PTR records are written to
        reverseServer: pdns   # controller for the PTR records; optional
      ipam: pve               # the zone's IPAM controller; `pve` when omitted
---
# Second network of the SAME `lab` zone — minimal form: just the provider and zone.
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: labnet2 }
spec:
  provider:
    type: proxmox
    spec: { zone: lab }
