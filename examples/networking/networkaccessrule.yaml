# ============================================================================
# kind: NetworkAccessRule — ONE INCREMENTAL firewall rule per document
#
# Unlike `kind: NetworkPolicy`, which REPLACES a whole direction's state on each
# apply (and refuses two documents for the same target+direction), several
# NetworkAccessRule for the SAME container ACCUMULATE — each removable on its
# own: drop it from the manifest and re-apply with --prune and only that one is
# retired; the other stays. Re-applying the same document replaces only the rule
# it owns ("the last command wins" for the same match). It only acts on workloads
# on a custom SDN network.
#
# spec fields: target*, direction*, port*, action, proto, from (* = required).
# The rule's identity is metadata.name. It is the incremental declarative
# primitive (ADR-0028); it does not replace `net ingress`/`net egress` and has
# no CLI verb of its own — it is applied like any other Kind.
#
# Apply:    delonix stack apply -f examples/networking/networkaccessrule.yaml
# ============================================================================

# ── 0. Supporting resources INLINE — the network and the target workload ─────
---
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata: { name: appnet }
spec: { driver: bridge }
---
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata: { name: web }
spec:
  network: appnet
  containers:
    - name: web
      image: "nginx:alpine"

# ── 1. every field explicitly set — allow TCP/8080 into `web` from one CIDR ──
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkAccessRule
metadata: { name: web-8080-from-lan }
spec:
  target: web                  # the workload the rule applies to
  direction: ingress           # ingress (traffic TO the workload) | egress (FROM it)
  action: allow                # allow (accept, default) | deny (drop)
  proto: tcp                   # tcp | udp | any (default any)
  port: "8080"                 # a port, a range "n-m", or "*" (any)
  from: 10.0.0.0/24            # CIDR of the other end (source on ingress); omit = anywhere

# ── 2. accumulates with rule 1 on the same target — a 2nd independent ingress rule
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkAccessRule
metadata: { name: web-metrics-from-monitoring }
spec:
  target: web                  # the SAME target — accumulates, does not replace
  direction: ingress
  proto: tcp
  port: "9090"
  from: 10.1.0.0/24

# ── 3. port range, UDP, defaults for action (allow) and from (anywhere) ──────
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkAccessRule
metadata: { name: web-udp-range }
spec:
  target: web
  direction: ingress
  proto: udp
  port: "5000-5100"

# ── 4. explicit deny of one abusive source, any protocol, any port ───────────
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkAccessRule
metadata: { name: web-block-bad-host }
spec:
  target: web
  direction: ingress
  action: deny
  proto: any
  port: "*"
  from: 203.0.113.7/32

# ── 5. EGRESS — `from` names the DESTINATION CIDR the workload may reach ─────
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkAccessRule
metadata: { name: web-egress-https }
spec:
  target: web
  direction: egress
  action: allow
  proto: tcp
  port: "443"
  from: 0.0.0.0/0

# ── 6. minimal form — only the required fields (direction + port + target) ───
---
apiVersion: networking.delonix.io/v1beta1
kind: NetworkAccessRule
metadata: { name: web-minimal }
spec:
  target: web
  direction: egress
  port: "53"
