# ============================================================================
# kind: KubernetesCluster — a kubeadm cluster in three modes (one per document)
#
# `spec.mode` is the discriminator and each mode reads only its own block:
#       kind  → nodes as containers, on THIS machine (no Docker, no `kind` binary)
#       vm    → every node is a real microVM from the golden image (hypervisor isolation)
#       ssh   → remote hosts that ALREADY EXIST (bare metal or someone else's VMs)
#     The common fields (k8sVersion/podSubnet/serviceSubnet/cni) are shared; the
#     specific ones live in the mode's block (`kind:`, `vm:`, `ssh:`).
#
# OUTSIDE the stack cycle. A cluster is NOT a node-local resource — it is a
#     remote procedure over SSH. So this Kind does NOT take part in
#     `stack apply`/`--prune`/`destroy`. Apply it with its own command:
#       delonix cluster apply   -f examples/cluster/kubernetescluster.yaml
#     and validate it offline (touching no machine) with:
#       delonix stack validate  -f examples/cluster/kubernetescluster.yaml
#       delonix manifest validate -f examples/cluster/kubernetescluster.yaml
# ============================================================================

# ── 1. mode kind — a local cluster in containers, right here ────────────────
---
apiVersion: cluster.delonix.io/v1beta1
kind: KubernetesCluster
metadata:
  name: kind-lab
spec:
  mode: kind
  k8sVersion: "1.34"                 # Kubernetes minor version
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
  cni: default                       # default = the node image's CNI (kindnet); none = install none
  controlPlane:
    replicas: 1                      # >1 requires controlPlaneEndpoint (LB/VIP)
  workers:
    replicas: 1
  kind:                              # only read in mode: kind
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a  # pinned by digest — a moving tag would make the cluster irreproducible
    apiServerPort: 6443              # host port for the apiserver (the generated kubeconfig points here)

# ── 2. mode ssh — remote hosts that already exist, HA control plane ─────────
---
apiVersion: cluster.delonix.io/v1beta1
kind: KubernetesCluster
metadata:
  name: ssh-prod
spec:
  mode: ssh
  k8sVersion: "1.34"
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
  cni: none                          # in production you usually install YOUR own CNI (Cilium, Calico…)
  controlPlaneEndpoint: "k8s-api.example.com:6443"   # REQUIRED with >1 control-plane (delonix does not provision the LB; point at one you have)
  controlPlane:
    hosts:                           # `hosts` (not `replicas`): the machines already exist
      - address: 10.0.0.11
      - address: 10.0.0.12
      - address: 10.0.0.13
  workers:
    hosts:
      - address: 10.0.0.21
      - address: 10.0.0.22
  ssh:                               # only read in mode: ssh
    user: delonix                    # needs passwordless sudo on the hosts
    keyPath: ~/.ssh/id_ed25519       # canonical name (`key` is the legacy spelling)
    port: 22
  etcd:
    mode: stacked                    # etcd on the control-planes (the kubeadm default)

# ── 3. mode vm — every node is a microVM from the golden image ──────────────
---
apiVersion: cluster.delonix.io/v1beta1
kind: KubernetesCluster
metadata:
  name: vm-lab
spec:
  mode: vm
  k8sVersion: "1.34"
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
  cni: none                          # bring your own CNI; `default` here serves ONE node only (refused above one, DX-6701) — for more nodes use a profile (doc 4)
  controlPlane:
    replicas: 1
  workers:
    replicas: 0
  vm:                                # only read in mode: vm
    image: k8s-golden                # tag from `delonix vm image ls`; omit = the only local image, if there is exactly one
    network: lab-net                 # created beforehand with `delonix network create`
    vcpus: 2                         # per node
    memory: 2G                       # per node
    sshKey: ~/.ssh/id_ed25519        # private key to reach the VMs; omit = a key is generated under <root>/clusters/<name>
    bootTimeout: 300s                # wait for SSH after boot

# ── 4. Cilium CNI profile (mode vm) — the pod network the bootstrap installs ─
---
apiVersion: cluster.delonix.io/v1beta1
kind: KubernetesCluster
metadata:
  name: cilium-lab
spec:
  mode: vm
  k8sVersion: "1.36"
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
  cni: cilium                        # a PROFILE (cilium/calico/flannel) pinned to a version + digest, installed and waited for by the bootstrap; `delonix cluster network profiles` prints the state of each
  network:                           # only read when `cni` names a profile that reads it (on default/none it is REFUSED, DX-1702)
    dataplane: vxlan                 # encapsulation; omit = vxlan (the only mode that asks nothing of the network between nodes)
    kubeProxy: iptables              # iptables (default, the measured mode); ipvs; none (Cilium only) changes `kubeadm init` and cannot be turned on later
    experimental: true               # an EXPLICIT acknowledgement that the profile is experimental in this release; without it the manifest is refused (DX-1705)
    # mtu: 1450                       # pod MTU; omitting is recommended (computed from nodeMtu minus the overhead)
    # nodeMtu: 1500                   # the nodes' real MTU, when it is not 1500
    # hubble: true                    # Cilium's observability (more pods, more resources)
    # multus: false                   # extra interfaces — an EXTENSION, never the primary network
    # offline: true                   # install only from the local cache (`cluster network fetch`)
    # interface: ens3                 # when interface autodetection is ambiguous
  controlPlane:
    replicas: 1
  workers:
    replicas: 2                      # possible now — the profile routes pods between nodes
  vm:
    image: k8s-golden
    network: lab-net
    vcpus: 2
    memory: 4G                       # the Cilium agent asks for more than a bridge does
    bootTimeout: 300s

# ── 5. mode ssh with a dedicated EXTERNAL etcd cluster (own CA, odd member count)
---
apiVersion: cluster.delonix.io/v1beta1
kind: KubernetesCluster
metadata:
  name: ssh-etcd-prod
spec:
  mode: ssh                          # etcd.mode external is supported ONLY with mode: ssh
  k8sVersion: "1.34"
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
  cni: none
  controlPlaneEndpoint: "k8s-api.example.com:6443"
  controlPlane:
    hosts:
      - address: 10.0.1.11
      - address: 10.0.1.12
      - address: 10.0.1.13
  workers:
    hosts:
      - address: 10.0.1.21
  ssh:
    user: delonix
    keyPath: ~/.ssh/id_ed25519
    port: 22
  etcd:
    mode: external                   # a dedicated etcd cluster, created and managed by delonix
    hosts:                           # dedicated etcd hosts, which must already exist; ODD count (1 = dev/test only, no HA; 3, 5, … in production)
      - address: 10.0.2.11
      - address: 10.0.2.12
      - address: 10.0.2.13
