# ============================================================================
# kind: App — build an application image from source with Cloud Native
#             Buildpacks, no Dockerfile
#
# `image` is the ONLY required field — the tag the built image gets in the
# LOCAL ImageStore. `source` (default ".") is relative to where you RUN the
# command (not to this file), the same convention `kind: Image`'s
# `build.context` uses. `builder` selects how the stack is built: `auto`
# (detect the stack — go.mod, package.json, requirements.txt, … — and use the
# Paketo builder), `heroku` (the Heroku family), or a custom builder image
# reference — and a custom builder MAKES `runImage` REQUIRED (the engine does
# not read a custom builder's `builder.toml` to guess its run image; refusing
# is the honest answer). No build cache: every apply rebuilds.
#
# Apply:    delonix stack apply -f examples/artifact/app.yaml
# ============================================================================

# ── 1. auto — auto-detected stack (Paketo builder) ───────────────────────────
---
apiVersion: core.delonix.io/v1beta1
kind: App
metadata:
  name: shop-auto
  labels:
    app: shop
spec:
  source: .                          # directory to build; relative to CWD, not this file
  builder: auto                      # auto | heroku | <builder image ref> (default auto)
  image: shop-auto:latest            # REQUIRED — tag of the built image in the local store

# ── 2. heroku — the Heroku builder family ────────────────────────────────────
---
apiVersion: core.delonix.io/v1beta1
kind: App
metadata:
  name: shop-heroku
spec:
  source: .
  builder: heroku
  image: shop-heroku:latest

# ── 3. custom — a custom builder image (requires runImage) ───────────────────
# `runImage` is required here (omitting it is an error) and meaningless with
# auto/heroku — the engine only reads it in this case.
---
apiVersion: core.delonix.io/v1beta1
kind: App
metadata:
  name: shop-custom
spec:
  source: .                          # any directory holding the source (e.g. ./services/shop); apply (and --dry-run) refuse one that does not exist
  builder: registry.example.com/buildpacks/builder-jammy-base:latest
  runImage: registry.example.com/buildpacks/run-jammy-base:latest
  image: shop-custom:1.0.0

# ── 4. defaults — only the image tag is mandatory ────────────────────────────
# source defaults to ".", builder to "auto".
---
apiVersion: core.delonix.io/v1beta1
kind: App
metadata:
  name: shop-defaults
spec:
  image: shop-defaults:latest
