# ============================================================================
# kind: Image — ensure an image is present: PULL it or BUILD it
#
# `pull` and `build` are MUTUALLY EXCLUSIVE (one document each). A pull is
# idempotent; an image's identity is its REFERENCE, not `metadata.name`.
# `pullSecret` names a `kind: Secret` with the registry credentials — only
# meaningful with `pull:` (a `build:` produces the image locally and
# authenticates nowhere, so a pullSecret there is refused). A built image does
# NOT converge: there is no build cache, every apply rebuilds and replaces the
# tag.
#
# Apply:    delonix stack apply -f examples/artifact/image.yaml
# ============================================================================

# ── 1. pull — pull a public image (idempotent) ───────────────────────────────
---
apiVersion: core.delonix.io/v1beta1
kind: Image
metadata:
  name: alpine
spec:
  pull: alpine:3.19            # pull this reference

# ── Supporting Secret — registry credentials for the private pull below ──────
# From the ENVIRONMENT (nothing secret is written in the manifest; the shape
# a CI job has). Alternative: `stringData: { username, password }` (cleartext).
---
apiVersion: core.delonix.io/v1beta1
kind: Secret
metadata:
  name: registry-cred
spec:
  fromEnv:
    username: REGISTRY_USER
    password: REGISTRY_TOKEN

# ── 2. private pull — credentials named by the manifest ──────────────────────
# Without `pullSecret`, a pull uses the MACHINE's credential vault
# (`delonix image login`) — per-machine state a manifest cannot carry, so it
# applied cleanly on the host where someone logged in and failed on every
# other one. Naming a Secret makes the document self-contained.
---
apiVersion: core.delonix.io/v1beta1
kind: Image
metadata:
  name: private-app
spec:
  pull: ghcr.io/ngolacloud/private-app:1.0
  pullSecret: registry-cred    # `kind: Secret` with username+password; only with pull

# ── 3. build — build from a Delonixfile/Dockerfile (every build field) ───────
# Every BuildSpec field. Only `tag` is required; the rest mirror the CLI's
# flags (`delonix image build`).
---
apiVersion: core.delonix.io/v1beta1
kind: Image
metadata:
  name: app-built
spec:
  build:
    tag: app:dev                     # required — the tag to produce
    context: .                       # build context directory (default ".")
    file: Delonixfile                # file path (default: ./Delonixfile, then ./Dockerfile)
    target: runtime                  # multi-stage: build up to this stage (name or index)
    platform: linux/amd64            # target architecture, like the CLI's --platform
    noCache: true                    # bypass the layer cache, like --no-cache
    buildArgs:                       # ARG overrides KEY=VALUE (only for ARGs the file declares)
      - VERSION=1.2.3
      - CHANNEL=stable
    secrets:                         # build-time secrets, `id=<name>,src=<path>`; used with
      - id=npmrc,src=./npmrc.txt     #     RUN --mount=type=secret,id=npmrc — never lands in a layer
