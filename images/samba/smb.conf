# Samba as a standalone file server: no AD, no printers, no NetBIOS.
# `testparm -s` checks this file during the build; an invalid one fails it.
[global]
   server role = standalone server
   workgroup = WORKGROUP
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3_00
   server smb encrypt = required
   map to guest = never
   restrict anonymous = 2
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = systemd
   passdb backend = tdbsam

[dados]
   path = /srv/samba/dados
   valid users = @smbusers
   read only = no
   force group = smbusers
   create mask = 0660
   directory mask = 2770
