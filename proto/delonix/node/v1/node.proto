// Delonix node API — node identity, health, capacity and events.
//
// Status: DRAFT contract for ADR-0040.
syntax = "proto3";

package delonix.node.v1;

import "delonix/node/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ngolacloud/delonix/gen/go/delonix/node/v1;nodev1";

service NodeService {
  // The entry point (ADR-0042 D2): the API version and a link to every resource
  // this socket serves, so a client navigates from here without building a URI.
  rpc GetApiRoot(GetApiRootRequest) returns (ApiRoot) {
    option (google.api.http) = {get: "/v1"};
  }
  rpc GetNodeInfo(GetNodeInfoRequest) returns (NodeInfo) {
    option (google.api.http) = {get: "/v1/node"};
  }
  // Liveness of the engine AND of what it depends on, one condition each. A consumer
  // must not read "the socket answered" as "the node can run workloads".
  rpc GetHealth(GetHealthRequest) returns (Health) {
    option (google.api.http) = {get: "/v1/node/health"};
  }
  rpc GetCapacity(GetCapacityRequest) returns (Capacity) {
    option (google.api.http) = {get: "/v1/node/capacity"};
  }
  // The node's scheduling write surface (ADR-0101, A6). Each replaces ONE dimension
  // of the node record and returns the resulting NodeInfo. No FieldMask (A4 proved it
  // does not transcode over REST): the body carries the whole dimension. Mutating, so
  // A3 (ADR-0098) authorizes by cert identity and audits every call.
  rpc SetNodeLabels(SetNodeLabelsRequest) returns (NodeInfo) {
    option (google.api.http) = {
      post: "/v1/node:setLabels"
      body: "*"
    };
  }
  rpc SetNodeTaints(SetNodeTaintsRequest) returns (NodeInfo) {
    option (google.api.http) = {
      post: "/v1/node:setTaints"
      body: "*"
    };
  }
  // Cordon (unschedulable=true) or uncordon (false). A cordoned node REFUSES a new
  // workload create with DX-5003 (ADR-0101 §3) — enforced at the node, not advisory.
  rpc SetSchedulability(SetSchedulabilityRequest) returns (NodeInfo) {
    option (google.api.http) = {
      post: "/v1/node:setSchedulability"
      body: "*"
    };
  }
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option (google.api.http) = {get: "/v1/providers"};
  }
  // Server-streamed engine events (the same records as `delonix system events`).
  // `since` replays from the persisted event log first, so a reconnecting client does not
  // miss what happened while it was away — within the log's retention, which the first
  // message states.
  rpc WatchEvents(WatchEventsRequest) returns (stream Event) {
    option (google.api.http) = {get: "/v1/events:watch"};
  }
  // Workload attestation (ADR-0102): given a host PID, the workload that owns it,
  // the image digest it runs and its labels — the facts a node-local SPIFFE
  // attestor needs, exposed as a plain read-only operation. An unmatched PID is a
  // normal answer (`found: false`), never an error.
  rpc AttestWorkload(AttestWorkloadRequest) returns (WorkloadAttestation) {
    option (google.api.http) = {get: "/v1/node/workloads/{pid}:attest"};
  }
}

message GetApiRootRequest {}

message ApiRoot {
  string api_version = 1; // "delonix.node.v1"
  // Only what this engine serves: a link to an operation it would answer 501 is
  // not offered.
  repeated Link links = 2;
}

message GetNodeInfoRequest {}

message NodeInfo {
  string engine_version = 1; // "3.1.0"
  string engine_commit = 2;
  string api_version = 3; // "delonix.node.v1"
  string hostname = 4;
  string kernel = 5;
  string arch = 6;
  bool rootless = 7;
  string cgroup_driver = 8; // "cgroupfs" | "systemd"
  bool cgroup_delegated = 9;
  repeated string supported_workload_types = 10; // "container", "pod", "vm", "microvm"
  repeated Link links = 11;
  // The scheduling surface (ADR-0101, A6). Operator-declared placement labels, taints
  // a control-plane scheduler honours, and the cordon flag the node ENFORCES.
  map<string, string> labels = 12;
  repeated Taint taints = 13;
  // true = cordoned: the node refuses a new workload create (DX-5003). Default false.
  bool unschedulable = 14;
  string unschedulable_reason = 15;
  // ADR-0090/0099 version of the node record. Node metadata is single-phase (the write
  // both sets and realizes the desired spec), so observed_generation == generation.
  // 0 means the record has never been written — a defined state, not an error.
  int64 generation = 16;
  int64 observed_generation = 17;
}

// A taint repels workloads that do not tolerate it. Advertised by the node and honoured
// by the control-plane scheduler (the node does not enforce tolerations — ADR-0101 §3).
message Taint {
  string key = 1;
  string value = 2;
  string effect = 3; // "NoSchedule" | "PreferNoSchedule" | "NoExecute"
}

message SetNodeLabelsRequest {
  // The complete desired label set — a full replace, not a merge.
  map<string, string> labels = 1;
}

message SetNodeTaintsRequest {
  // The complete desired taint set — a full replace, not a merge.
  repeated Taint taints = 1;
}

message SetSchedulabilityRequest {
  bool unschedulable = 1;
  string reason = 2; // recorded as unschedulable_reason; free text
}

message GetHealthRequest {}

message Health {
  // Overall = worst of the parts. Each part is a Condition with a stable reason:
  // "NetworkReady", "StoreWritable", "CgroupDelegated", "ProvidersAvailable".
  ConditionStatus overall = 1;
  repeated Condition conditions = 2;
  repeated Link links = 3;
}

message GetCapacityRequest {}

message Capacity {
  int64 cpu_millis_total = 1;
  int64 cpu_millis_allocatable = 2;
  int64 memory_bytes_total = 3;
  int64 memory_bytes_allocatable = 4;
  int64 pids_allocatable = 5;
  repeated FilesystemCapacity filesystems = 6;
  int32 containers_running = 7;
  int32 vms_running = 8;
  // Fields that could not be measured are listed here instead of being reported as 0.
  // A zero that comes from a failed measurement is not a zero.
  repeated string unmeasured = 9;
  repeated Link links = 10;
  // Extended resources (ADR-0101, A6). Each follows the same doctrine: measured when it
  // can be, named in `unmeasured` when it cannot (never a misleading zero).
  // Discrete devices, e.g. "nvidia.com/gpu". Empty with "devices.gpu" in `unmeasured`
  // means the node did not establish GPU presence (no NVIDIA driver, or none probed).
  repeated DeviceCapacity devices = 11;
  // The node's declarative IP inventory, one entry per `kind: IPPool`. Absent when no
  // pool is declared (absent, not unmeasured — the same rule filesystems use).
  repeated IpPoolCapacity ip_pools = 12;
  // Operator-declared CPU/memory overcommit ratios (set via `kind: Node`). Unset leaves
  // "overcommit.cpu"/"overcommit.memory" in `unmeasured`: the engine has no node-level
  // overcommit ratio of its own, so an un-declared one is unmeasured, not 1.0.
  OvercommitRatios overcommit = 13;
}

message DeviceCapacity {
  string kind = 1; // "nvidia.com/gpu"
  int64 total = 2;
  int64 allocatable = 3;
}

message IpPoolCapacity {
  string name = 1;
  int64 addresses_total = 2;
  int64 addresses_allocated = 3;
}

message OvercommitRatios {
  double cpu = 1;
  double memory = 2;
}

message FilesystemCapacity {
  string role = 1; // "state", "images", "volumes", "vm-images"
  string mountpoint = 2;
  int64 bytes_total = 3;
  int64 bytes_available = 4;
  int64 inodes_total = 5;
  int64 inodes_available = 6;
}

message ListProvidersRequest {
  string kind = 1; // empty = all
}

message ListProvidersResponse {
  repeated ProviderInfo providers = 1;
  repeated Link links = 2;
}

message WatchEventsRequest {
  google.protobuf.Timestamp since = 1; // unset = only new events
  repeated string kinds = 2; // "container", "vm", "network", "security", …
  string namespace = 3;
}

message Event {
  google.protobuf.Timestamp time = 1;
  string kind = 2;
  string action = 3; // "start", "die", "oom", "create", "delete", "applied", "converged", …
  string target = 4; // "Container/web"
  string namespace = 5;
  map<string, string> attributes = 6;
  string trace_id = 7;
  // ADR-0099/0100 record metadata, read off the referenced resource when this event
  // is streamed, so a control plane tells a desired change from a state change on the
  // stream. Absent (0) means "unversioned" — a defined state, not an error.
  // generation > observed_generation ⇒ a desired change not yet realized; equal and
  // non-zero ⇒ converged; both 0 ⇒ a resource with no version (or a kind this watch
  // does not resolve). The "applied"/"converged" actions mark where a transition
  // happened (ADR-0100).
  int64 generation = 8;
  int64 observed_generation = 9;
}

message AttestWorkloadRequest {
  int64 pid = 1; // host PID — the container's / pod sandbox's init (pid 1) process
}

// The identity of the workload a host PID belongs to, plus the image and the
// labels an attestor selects on. Only what the node already records: the image
// digest is resolved best-effort from the image store (empty if the reference is
// not a stored tag), and the labels are the container's (OCI image-level labels
// are not persisted — ADR-0102). A PID that owns no live workload comes back with
// `found: false` and the pid echoed, the rest empty.
message WorkloadAttestation {
  int64 pid = 1;
  bool found = 2;
  string container_id = 3;
  string name = 4;
  string namespace = 5;
  string pod = 6; // the owning pod/sandbox; empty for a lone container
  string image = 7; // the image REFERENCE the workload was created with
  string image_digest = 8; // resolved "sha256:…", empty when unknown
  map<string, string> labels = 9;
  map<string, string> annotations = 10;
  repeated Link links = 11;
}
