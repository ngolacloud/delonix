[package]
name = "delonix-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

# The MCP (Model Context Protocol) server — a LOCAL, tenancy-free AI control
# surface over this engine (ADR-0025). Outside the eight dependency-clean
# engine crates on purpose, same category as `delonix-mgmt`: it carries the
# official Rust MCP SDK (`rmcp`) and its own `tokio` runtime, and no engine
# crate depends on it.
[dependencies]
delonix-compute = { workspace = true }
delonix-node = { workspace = true }
delonix-host = { workspace = true }
delonix-model = { workspace = true }
# Reused for its Prometheus-shaped runtime summary (`dashstats::collect`) so
# `runtime.info`/`metrics.query` do not re-derive the same counts a second way.
delonix-mgmt = { workspace = true }

rmcp = { workspace = true, features = ["server", "transport-io", "macros", "schemars"] }
schemars = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# R3e: the container/volume/network/metrics reads reach production through the
# `EngineReads` port the bin mounts over `delonix-engine`; this crate no longer
# names these adapters in production. The tests keep a real-adapter backing for
# the port (so the usage-sampling behaviour is still exercised end to end), which
# is the ONLY reason these four stay in the dependency graph at all — as
# dev-dependencies, the same pattern the other interfaces use for their ports.
delonix-state = { workspace = true }
delonix-volume = { workspace = true }
delonix-sdn = { workspace = true }
delonix-linux = { workspace = true }

[lints]
workspace = true
