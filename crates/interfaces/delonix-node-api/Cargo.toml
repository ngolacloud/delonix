[package]
name = "delonix-node-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The node API of the Delonix Runtime: gRPC and HTTP/JSON of delonix.node.v1 on a local unix socket (ADR-0040 P5)."
repository.workspace = true

# The node contract served (ADR-0040 D4, ADR-0042): gRPC and HTTP/JSON from the
# same `proto/delonix/node/v1` files, on one unix socket, for the calling uid
# only. The generated code lives here, not in a `delonix-node-proto` crate: a
# crate of generated code with one consumer is the dead scaffolding ADR-0040 P1
# refuses, and the CRI keeps its stubs the same way (`delonix_cri::cri`).

[dependencies]
delonix-compute = { workspace = true }
delonix-node = { workspace = true }
delonix-host = { workspace = true }
delonix-model = { workspace = true }
delonix-storage = { workspace = true }
delonix-pool-helper = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
pbjson = { workspace = true }
pbjson-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time", "process", "io-util"] }
tokio-stream = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server", "http1", "http2"] }
tower = { workspace = true, features = ["util"] }
libc = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
prost = { workspace = true }
pbjson-build = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The VM adapter is the composition's mechanism: production reaches it only
# through the engine-backed `VmPort` the bin injects (ADR-0040 A5). The tests
# seed VM backends and build an adapter-backed port directly, so it is a
# dev-dependency — no `interface -> delonix-vm` edge survives in the graph.
delonix-vm = { workspace = true }
# R3d-d — production no longer names it; kept for `store::LocalStore` test backing
# and record seeding in the crate's own tests + integration tests.
delonix-state = { workspace = true }
# R3d-f — production no longer names the SDN adapter; it reaches it only through
# the `NetworkOps` port the bin composes. Kept for `net_ops::LocalNet` and the
# integration harness's `AdapterNet` test backings, and the matrix/parse tests.
delonix-sdn = { workspace = true }
# R3d-g — production no longer names the OCI adapter; it reaches the image store
# only through the `ImageRepo` port the bin composes. Kept for the integration
# harness's `AdapterImages` test backing over the real store.
delonix-oci = { workspace = true }
# R3d-h — production no longer names the Proxmox/OPNsense providers; it reaches
# their capability reports only through the `ProviderReports` port the bin
# composes. Kept for `provider_reports::LocalProviders` (the crate's own matrix/
# parse tests) and the integration harness's `AdapterProviders` test backing.
delonix-provider-proxmox = { workspace = true }
delonix-provider-opnsense = { workspace = true }
# R3d-j — production no longer names the Ceph adapter; it reaches the cluster
# (health, RBD/CephFS listings, RGW, pool drivers) only through the
# `CephStorage` port the bin composes. Kept for `storage_backend::LocalCeph`, the
# live-Ceph test and the integration harness's `AdapterCeph` test backing.
delonix-provider-ceph = { workspace = true }
# R3d-h/i/j — production no longer names the Linux or volume adapters: the
# container lifecycle goes through the `LinuxLifecycle` port, the volume store
# through `VolumeStore`, and the provider reports through `ProviderReports`, all
# composed by the bin. Kept for the crate's `#[cfg(test)] LocalLinux`/
# `LocalVolumes`/`LocalProviders` backings and the integration harness's
# `AdapterLinux`/`AdapterVolumes` — no `interface -> delonix-linux`/`-volume`
# edge survives in the graph.
delonix-linux = { workspace = true }
delonix-volume = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
