[package]
name = "delonix-mgmt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "API de gestão local do Delonix Runtime (HTTP+JSON sobre unix socket)."
repository.workspace = true

[dependencies]
delonix-compute = { workspace = true }
delonix-node = { workspace = true }
delonix-host = { workspace = true }
delonix-model = { workspace = true }
delonix-state = { workspace = true }
delonix-telemetry = { workspace = true }
delonix-volume = { workspace = true }
delonix-sdn = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "server"] }
tower = { workspace = true, features = ["util"] }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
# R3f: production serves every engine use case through the `EngineOps` port. The
# tests back that port with a real `delonix-engine::Engine` (the arch gate ignores
# dev-deps, so this test-only interface→assembly edge is uncounted), and seed the
# image store directly through `delonix-oci` for the image-endpoint test.
delonix-engine = { workspace = true }
delonix-oci = { workspace = true }

[lints]
workspace = true
