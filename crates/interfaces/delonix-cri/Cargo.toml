[package]
name = "delonix-cri"
version.workspace = true
edition.workspace = true
license.workspace = true

# `delonix-cri` — the CRI server (`runtime.v1`) library. Its executable lives in
# the `delonix-cri-bin` crate (ADR-0040 D2.4: the bin composes the engine and
# hands this server its ports; an interface crate names no assembly). R3h moved
# the binary out of this crate for exactly that composition.

[dependencies]
delonix-node = { workspace = true }
delonix-host = { workspace = true }
delonix-model = { workspace = true }
delonix-telemetry = { workspace = true }
delonix-compute = { workspace = true }
delonix-linux = { workspace = true }
delonix-sdn = { workspace = true }
delonix-security = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time", "signal", "sync"] }
tokio-stream = { workspace = true, features = ["net"] }
axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true, features = ["sink"] }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
flate2 = { workspace = true, features = ["zlib-rs"] }
libc = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
# Só para o round-trip gRPC de `tests/grpc_status.rs` — o cliente gerado precisa
# de um conector para socket unix, que o tonic não traz por si.
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
# R3h: a produção já não nomeia o `delonix-state`; fica aqui só para o SEEDING dos
# testes (o backing `test_ops::StoreOps` e os testes que gravam records em disco).
delonix-state = { workspace = true }

[lints]
workspace = true
