[package]
name = "delonix-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
delonix-model = { workspace = true }
delonix-compute = { workspace = true }
delonix-vm = { workspace = true }
# The read-side adapters the engine composes away for the interfaces (R3e): the
# container/secret store, the named-volume store, the SDN infra view, and the
# host container/process metrics. Assembly may depend on an adapter (A1); an
# interface may not, which is the edge this move pays down (`delonix-mcp` held
# all four directly before R3e).
delonix-state = { workspace = true }
delonix-volume = { workspace = true }
delonix-sdn = { workspace = true }
delonix-linux = { workspace = true }
# R3f: the image store and the SBOM scanner, composed away for `delonix-mgmt`'s
# image/scan endpoints the same way (an interface may not name an adapter).
delonix-oci = { workspace = true }
delonix-scanner = { workspace = true }
# R3f-B: the resource-summary collector (`dash_summary`/`workload_series`) moved
# off `delonix-mgmt` into the engine; it builds the exporter's `WorkloadSeries`.
delonix-telemetry = { workspace = true }
serde_json = { workspace = true }
