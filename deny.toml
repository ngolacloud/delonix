# cargo-deny — rede de segurança de supply-chain de um runtime de containers.
# Corrido no CI (`cargo deny check`) e localmente. Schema v2.

[advisories]
version = 2
# RUSTSEC + yanked são negados por omissão no schema v2. Um advisory só passa se
# for listado aqui com justificação e data de revisão — nunca silenciar às cegas.
yanked = "deny"
# Só `unmaintained` (não são vulnerabilidades). Cada um com razão e revisão — um
# CVE/`unsound` real continua a FALHAR o gate. Rever a cada bump de deps.
ignore = [
    # chrono não mantido (anunciado 2026) — TRANSITIVO, nenhum crate nosso o usa
    # directamente: entra via `schemars` (JSON Schema dos manifestos), `pbjson-types`
    # (JSON do node-API gRPC) e `rmcp` (MCP). Unmaintained, não CVE. Sem acção do
    # nosso lado até esses upstreams o largarem; sai quando saírem.
    "RUSTSEC-2026-0543",
]
# Saíram a 2026-11-22 porque cada um cumpriu a condição de saída que o seu próprio
# comentário escrevia, e o `cargo-deny` já avisava («advisory was not encountered»)
# que guardavam coisa nenhuma. Uma excepção que deixou de se aplicar é tão má como
# uma que falta: se o crate voltar, é um advisory real a ser ignorado em silêncio.
# Medido nas DUAS linhas (`origin/main` e `origin/develop`), por contagem no
# `Cargo.lock`:
#
#   RUSTSEC-2025-0134  rustls-pemfile  0 ocorrências  — o FIXME fechou: o proxy TLS
#                      passou a `rustls-pki-types::PemObject` sem nova dependência
#                      (`bins/delonix/src/cmd/ingress_proxy.rs`)
#   RUSTSEC-2024-0449  unsafe-libyaml  0  — e o `serde_yaml` que o puxava também
#                      saiu da árvore: a migração dos parsers de manifesto foi feita
#   RUSTSEC-2024-0436  paste           0  — o `ratatui` continua lá (1) e largou-o,
#                      exactamente como o comentário previa

[licenses]
version = 2
# Só licenças permissivas — compatíveis com Apache-2.0 (a licença deste repo).
# Copyleft forte (GPL/AGPL) NÃO entra: um runtime público não pode arrastar
# obrigações de redistribuição de fonte para quem o embute.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Duplicados de versão são inevitáveis com ~215 deps transitivas — avisar, não
# bloquear (apertar para "deny" seria ruído sem sinal de segurança).
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Nada de fontes não confiáveis. Hoje a árvore é 100% crates.io + path interno
# (sem deps git) — se um dia entrar um git, tem de ser adicionado aqui a sério.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
